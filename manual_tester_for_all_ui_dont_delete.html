<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧪 Manual Tester — כל ממשק המשחק</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f1e;--sb:#16162a;--bdr:rgba(255,255,255,.08);
  --gold:#ffd700;--txt:#e8e8f0;--muted:rgba(255,255,255,.45);--r:10px;}
body{font-family:'Nunito','Segoe UI',sans-serif;background:var(--bg);color:var(--txt);
     display:flex;height:100vh;overflow:hidden;font-size:13px;}
#sb{width:284px;min-width:284px;background:var(--sb);border-left:1px solid var(--bdr);
    display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;}
#sb::-webkit-scrollbar{width:3px}#sb::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}
.sb-hdr{padding:11px 14px 9px;font-size:.95rem;font-weight:900;color:var(--gold);
        border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sec{padding:9px 12px 6px;border-bottom:1px solid var(--bdr);}
.sec-h{font-size:.68rem;font-weight:900;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.pills{display:flex;flex-wrap:wrap;gap:4px;}
.p{padding:4px 10px;border-radius:20px;border:1.5px solid rgba(255,255,255,.13);
   background:rgba(255,255,255,.05);color:var(--txt);font-family:'Nunito',sans-serif;
   font-size:.78rem;font-weight:800;cursor:pointer;transition:all .14s;white-space:nowrap;}
.p:hover{background:rgba(255,255,255,.14);transform:scale(1.04)}.p:active{transform:scale(.94)}
.p.on{background:var(--gold);color:#1a1200;border-color:var(--gold);box-shadow:0 0 10px rgba(255,215,0,.35);}
.p.g{border-color:rgba(105,240,174,.3)}.p.g:hover{background:rgba(105,240,174,.12)}.p.g.on{background:#69F0AE;color:#012a0c;border-color:#69F0AE}
.p.b{border-color:rgba(100,181,246,.3)}.p.b:hover{background:rgba(100,181,246,.12)}.p.b.on{background:#64B5F6;color:#001a3a;border-color:#64B5F6}
.p.pk{border-color:rgba(244,143,177,.3)}.p.pk:hover{background:rgba(244,143,177,.12)}.p.pk.on{background:#F48FB1;color:#2a0010;border-color:#F48FB1}
.p.pu{border-color:rgba(206,147,216,.3)}.p.pu:hover{background:rgba(206,147,216,.12)}.p.pu.on{background:#CE93D8;color:#1a001a;border-color:#CE93D8}
.p.or{border-color:rgba(255,183,77,.3)}.p.or:hover{background:rgba(255,183,77,.12)}.p.or.on{background:#FFB74D;color:#2a1000;border-color:#FFB74D}
.sr{display:flex;align-items:center;gap:5px;margin-top:4px;}
.sr input{flex:1;padding:5px 8px;border-radius:8px;border:1.5px solid rgba(255,255,255,.13);
           background:rgba(255,255,255,.06);color:var(--txt);font-family:'Nunito',sans-serif;
           font-size:.82rem;font-weight:800;text-align:center;}
.sr input:focus{outline:none;border-color:var(--gold);}
.ib{padding:5px 9px;border-radius:8px;border:1.5px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-family:'Nunito',sans-serif;
    font-size:.8rem;font-weight:800;transition:all .13s;}
.ib:hover{background:rgba(255,255,255,.16);}
#stat{padding:7px 12px;background:rgba(0,0,0,.35);border-top:1px solid var(--bdr);flex-shrink:0;font-size:.72rem;color:var(--muted);}
#stat-t{color:var(--gold);font-weight:800;}
#load-sec{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 16px;text-align:center;flex-shrink:0;}
#load-sec p{color:rgba(255,214,255,.7);font-size:.82rem;line-height:1.5;}
.load-btn{padding:9px 18px;border-radius:24px;border:1.5px dashed rgba(255,215,0,.45);
           background:rgba(255,215,0,.07);color:var(--gold);font-family:'Nunito',sans-serif;
           font-size:.85rem;font-weight:900;cursor:pointer;transition:all .15s;}
.load-btn:hover{background:rgba(255,215,0,.15);}
#fw{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.ftop{padding:5px 12px;background:rgba(0,0,0,.4);border-bottom:1px solid var(--bdr);
       display:flex;align-items:center;gap:8px;font-size:.74rem;color:var(--muted);flex-shrink:0;}
.ftop-note{margin-right:auto;opacity:.6;font-size:.7rem;}
.ftop button{padding:3px 10px;border-radius:6px;border:1px solid rgba(255,255,255,.14);
             background:rgba(255,255,255,.06);color:var(--txt);cursor:pointer;font-size:.72rem;font-weight:800;font-family:'Nunito',sans-serif;}
.ftop button:hover{background:rgba(255,255,255,.14);}
iframe{width:100%;flex:1;border:none;display:block;background:#fff;}
</style>
</head>
<body>

<aside id="sb">
  <div class="sb-hdr">🧪 Manual Tester</div>

  <div id="load-sec">
    <p>בחר את <code>index.html</code> של המשחק כדי להתחיל.<br>
       (אפשר גם ללחוץ "טען אוטומטית" אם הטסטר יושב בתיקיית המשחק.)</p>
    <input type="file" id="fp" accept=".html" style="display:none">
    <button class="load-btn" onclick="document.getElementById('fp').click()">📂 בחר index.html</button>
    <button class="load-btn" onclick="autoLoad()">⚡ טען אוטומטית</button>
  </div>

  <div id="ctrl" style="display:none">
    <!-- Level -->
    <div class="sec">
      <div class="sec-h">📊 רמה (הבריכה הטבעית)</div>
      <div class="pills" id="mode-row"></div>
    </div>
    <!-- Exercise type -->
    <div class="sec">
      <div class="sec-h">📝 סוג תרגיל (כפייה)</div>
      <div class="pills" id="type-row"></div>
    </div>
    <!-- Special screens -->
    <div class="sec">
      <div class="sec-h">✨ מסכים מיוחדים</div>
      <div class="pills">
        <span class="p" onclick="showEnd()">🏁 סיום</span>
        <span class="p" onclick="showReport()">📊 דוח</span>
        <span class="p" onclick="showSad()">😢 שגיאה</span>
      </div>
    </div>
    <!-- Tools -->
    <div class="sec">
      <div class="sec-h">⚙️ כלים</div>
      <div class="sr">
        <span style="color:var(--gold);font-weight:900">⭐</span>
        <input id="sc" type="number" value="200" min="0" max="9999">
        <button class="ib" onclick="applyScore()">✓</button>
      </div>
      <div class="pills" style="margin-top:6px">
        <span class="p" onclick="cycleTheme()">🎨 ערכה הבאה</span>
        <span class="p" onclick="repeat()">🔄 חדש</span>
        <span class="p" onclick="reload()">🔃 רענן</span>
      </div>
    </div>
  </div>

  <div style="flex:1"></div>
  <div id="stat"><span id="stat-t">טרם נטען</span></div>
</aside>

<div id="fw">
  <div class="ftop">
    <button onclick="reload()">🔃 Reload</button>
    <span class="ftop-note" id="ftop-note">פתח את index.html</span>
    <button onclick="document.getElementById('fp').click()">📂 קובץ אחר</button>
  </div>
  <iframe id="frame"></iframe>
</div>

<script>
/* ─── State ─── */
let gameHtml = null;
let curMode  = 20;
let curType  = null;
const frame  = document.getElementById('frame');
const THEMES = ['girls','galaxy','reef','dubai','savanna','dinosaurs'];

/* Levels (the game's real modes) and a friendly label. */
const MODES = [
  ['0','1+1 🌱','g'],['5','עד 5 ⭐','g'],['10','עד 10 ⭐','g'],['20','עד 20 ⭐','g'],
  ['br','גֶּשֶׁר 10 🌉','g'],['b20','גֶּשֶׁר 20 🌉','g'],['mx','מַלְכָּה 👑','g'],
  ['sup','סוּפֶּרְמֶן 🦸','g'],['poly','צוּרוֹת 🔷','g'],['big','מִסְפָּרִים גְּדוֹלִים 🔢','g'],
];

/* Every exercise TYPE: [label, key, mode-that-loads-it, module-needed-for-render,
   probExpr]. The game's type consts (TM/TA/…) and `problems` are top-level
   const/let — NOT window props — so we can't read them from the parent; instead
   the whole force runs via win().eval() where those names resolve. probExpr is a
   JS expression (evaluated in the game window) returning ONE problem object. */
const TYPES = [
  ['➕ חיבור',        'TA','20',null,       "({t:TA,a:7,b:8})",'b'],
  ['➖ חיסור',        'TS','20',null,       "({t:TS,a:15,b:6})",'b'],
  ['❓ חֶסֶר',        'TM','20',null,       "({t:TM,a:15,b:13})",'b'],
  ['➕➕ שני נעלמים',  'TDA','mx',null,      "({t:TDA,r:15})",'pu'],
  ['➖➖ הֶפְרֵשׁ',     'TDS','mx',null,      "({t:TDS,r:9})",'pu'],
  ['🔢 שלושה נעלמים', 'TRA','mx',null,      "({t:TRA,r:15})",'pu'],
  ['🔷 נעלם-צורה',    'TVA','mx','var_one', "({t:TVA,a:7,b:5,sym:'circle'})",'pu'],
  ['🔷🔷 שתי צורות',  'TVA2','mx','var_one',"({t:TVA,a:7,b:5,sym:'circle',symA:'triangle'})",'pu'],
  ['🔗 שרשרת +',      'TZ','mx','chain',    "(EXERCISES.types.chain.make('mx').filter(p=>p.t===TZ)[0])",'pk'],
  ['🔗 שרשרת ±',      'TX','mx','chain',    "(EXERCISES.types.chain.make('mx').filter(p=>p.t===TX)[0])",'pk'],
  ['🔗 שרשרת − −',    'TW','mx','chain',    "(EXERCISES.types.chain.make('mx').filter(p=>p.t===TW)[0])",'pk'],
  ['🔟 עֲשָׂרוֹת',     'TT','mx','tens',     "(EXERCISES.types.tens.make('mx')[0])",'or'],
  ['💯 מֵאוֹת',       'TH','mx','hundreds', "(EXERCISES.types.hundreds.make('mx')[0])",'or'],
  ['🪙 מטבעות',       'TC','20','coins',    "(EXERCISES.types.coins.make('mx')[0])",'or'],
  ['🔟 גדולים ±',     'TBG','sup','big_step',"(EXERCISES.types.big_step.make('sup')[0])",'or'],
  ['🧮 חיבור בטור',   'TCA','sup','column_add',"({t:TCA,a:47,b:38})",'pu'],
  ['🧮 חיסור בטור',   'TCS','sup','column_sub',"({t:TCS,a:52,b:37})",'pu'],
  ['🪙× כפל מטבעות',  'TCM','sup','coin_mul',"(EXERCISES.types.coin_mul.make('sup')[0])",'or'],
  ['🥨 בַּיְגְלֶה',     'TBC','sup','bagel_cost',"(EXERCISES.types.bagel_cost.make('sup')[0])",'or'],
  ['🔷 צוּרוֹת (צְלָעוֹת)','TPG','poly','polygon',"({t:TPG,a:6,b:0})",'pk'],
  ['🔷 צוּרוֹת (קֹדְקוֹדִים)','TPGv','poly','polygon',"({t:TPG,a:6,b:1})",'pk'],
  ['⭐ כּוֹכָב (צְלָעוֹת)','TPGs','poly','polygon',"({t:TPG,a:10,b:0})",'pk'],
  ['✖️ כֶּפֶל שַׁרְשֶׁרֶת','TMC','mx','mult_chain',"(EXERCISES.types.mult_chain.make('mul')[0])",'pu'],
];

/* ─── build the pill rows ─── */
function buildPills(){
  const mr=document.getElementById('mode-row');
  mr.innerHTML='';
  MODES.forEach(([m,lbl,cls])=>{
    const el=document.createElement('span');
    el.className='p '+cls; el.dataset.m=m; el.textContent=lbl;
    el.onclick=()=>setLevel(m);
    mr.appendChild(el);
  });
  const tr=document.getElementById('type-row');
  tr.innerHTML='';
  TYPES.forEach((t,i)=>{
    const el=document.createElement('span');
    el.className='p '+t[5]; el.dataset.k=t[1]; el.textContent=t[0];
    el.onclick=()=>forceType(i);
    tr.appendChild(el);
  });
}

/* ─── helpers ─── */
function st(txt){document.getElementById('stat-t').textContent=txt;}
function scoreVal(){return +document.getElementById('sc').value||200;}
function win(){try{return frame.contentWindow;}catch(e){return null;}}
/* run code / read a value INSIDE the game window's global scope (where the
   const type names + let `problems` resolve — they are NOT window props) */
function run(code){const w=win();if(!w)return;try{w.eval(code);}catch(e){st('⚠️ '+e.message);}}
function ev(code){const w=win();if(!w)return undefined;try{return w.eval(code);}catch(e){return undefined;}}
function ready(){return ev("typeof setMode==='function' && typeof problems!=='undefined' && !!window.EXERCISES")===true;}
function markMode(m){document.querySelectorAll('#mode-row .p').forEach(p=>p.classList.toggle('on',String(p.dataset.m)===String(m)));}
function markType(k){document.querySelectorAll('#type-row .p').forEach(p=>p.classList.toggle('on',p.dataset.k===k));}

/* poll until cond() true (or timeout), then run cb */
function waitFor(cond,cb,tries){
  tries=tries==null?80:tries;
  if(cond()){cb();return;}
  if(tries<=0){st('⏱️ timeout');return;}
  setTimeout(()=>waitFor(cond,cb,tries-1),60);
}

/* ─── load the game into the iframe (srcdoc keeps it same-origin; relative
       script/css paths resolve against THIS file's dir = the game dir) ─── */
/* force relative <script>/<link> URLs to resolve against the game dir (this
   file's dir) — some browsers resolve srcdoc URLs against about:srcdoc, so a
   <base> tag makes it deterministic. */
function withBase(html){
  const dir=location.href.replace(/[^\/]*$/,'');
  return /<head[^>]*>/i.test(html) ? html.replace(/<head([^>]*)>/i,'<head$1><base href="'+dir+'">')
                                   : '<base href="'+dir+'">'+html;
}
function bootGame(cb){
  try{localStorage.setItem('introSplash','0');}catch(e){}
  frame.onload=()=>waitFor(ready,()=>{ if(cb)cb(); });
  frame.srcdoc=withBase(gameHtml);
}
function afterLoad(){
  document.getElementById('load-sec').style.display='none';
  document.getElementById('ctrl').style.display='';
  buildPills();
  bootGame(()=>{ setLevel(curMode); });
}

document.getElementById('fp').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{gameHtml=ev.target.result;document.getElementById('ftop-note').textContent=f.name;afterLoad();};
  r.readAsText(f,'UTF-8');
});

/* auto-load index.html from the same folder (works when served or when the
   browser allows sibling file:// fetch; falls back to the picker on failure) */
function autoLoad(){
  fetch('index.html').then(r=>r.text()).then(t=>{
    gameHtml=t;document.getElementById('ftop-note').textContent='index.html (auto)';afterLoad();
  }).catch(()=>{ st('⚠️ טעינה אוטומטית נכשלה — בחר קובץ ידנית'); });
}

/* mode arg as a JS literal ('20' → 20 for numeric levels, else quoted) */
function modeLit(m){return /^\d+$/.test(m)?m:JSON.stringify(m);}

/* ─── level (natural pool) ─── */
function setLevel(m){
  curMode=m; curType=null; markMode(m); markType(null);
  if(!win()){st('טוען…');return;}
  run("setMode("+modeLit(m)+")");
  waitFor(()=>ev("problems&&problems.length>0")===true,
    ()=>run("score="+scoreVal()+";if(typeof updateScore==='function')updateScore();"));
  st('📊 '+m);
}

/* ─── force a specific exercise type ─── */
function forceType(i){
  const t=TYPES[i], key=t[1], mode=t[2], mod=t[3], expr=t[4];
  curType=i; markType(key); markMode(mode);
  if(!win()){st('טוען…');return;}
  run("setMode("+modeLit(mode)+")");
  // wait until the pool built AND (if needed) the render module is loaded
  const cond="problems&&problems.length>0"+(mod?" && !!(EXERCISES.types&&EXERCISES.types['"+mod+"'])":"");
  waitFor(()=>ev(cond)===true,()=>{
    run("(function(){var _p="+expr+";if(_p){problems=[_p];idx=0;report=[];done=false;"+
        "score="+scoreVal()+";if(typeof updateScore==='function')updateScore();loadProblem();}})()");
    st('📝 '+key+'  |  '+mode+'  |  ⭐'+scoreVal());
  });
}

/* ─── tools ─── */
function repeat(){ if(curType!=null)forceType(curType); else setLevel(curMode); }
function applyScore(){ run("score="+scoreVal()+";if(typeof updateScore==='function')updateScore();"); st('⭐ '+scoreVal()); }
function cycleTheme(){
  let cur='girls'; try{cur=localStorage.getItem('gameTheme')||'girls';}catch(e){}
  const next=THEMES[(THEMES.indexOf(cur)+1)%THEMES.length];
  try{localStorage.setItem('gameTheme',next);}catch(e){}
  if(ev("typeof pickTheme==='function'")===true){run("pickTheme("+JSON.stringify(next)+")");st('🎨 '+next);}
  else reload();
}
function reload(){ if(!gameHtml)return; bootGame(()=>{ if(curType!=null)forceType(curType); else setLevel(curMode); }); }

/* ─── special screens ─── */
function forceEndReport(open){
  if(!win())return;
  run("setMode(20)");
  waitFor(()=>ev("problems&&problems.length>0")===true,()=>{
    run("report=Array.from({length:12},function(_,i){return{ptype:TA,num1:5,num2:3,correct:8,wrongs:i%3===0?[99]:[],gotCorrect:i%3!==0,skipped:i===7};});"+
        "problems=report.map(function(r){return{t:r.ptype,a:r.num1,b:r.num2};});idx=12;done=false;score=160;"+
        "if(typeof endGame==='function')endGame();");
    if(open)setTimeout(()=>run("if(typeof reportOpen==='function')reportOpen();"),300);
  });
}
function showEnd(){forceEndReport(false);st('🏁 סיום');}
function showReport(){forceEndReport(true);st('📊 דוח');}
function showSad(){
  forceType(0);
  setTimeout(()=>run("if(typeof showSadModal==='function')showSadModal();else if(typeof setFb==='function')setFb('אוֹפְּס','fb-err');"),450);
  st('😢 שגיאה');
}
</script>
</body>
</html>

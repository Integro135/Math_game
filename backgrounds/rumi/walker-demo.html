<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chibi walker — integration demo</title>
<style>
  html,body{margin:0;height:100%;}
  /* a stand-in "background screen" — in the real game this is the scene container */
  #screen{
    position:relative; width:100%; height:100vh; overflow:hidden;
    background:linear-gradient(180deg,#8fd0ff 0%,#cdefff 55%,#bdE3a0 55%,#a6dd84 100%);
  }
  .ground{position:absolute;left:0;right:0;bottom:0;height:14%;
    background:#9bd86b;border-top:5px solid #6fae45;}
  .hud{position:absolute;left:12px;top:10px;font:14px system-ui;color:#234;background:#fff8;
    padding:6px 10px;border-radius:8px;}
  .hud button{font:13px system-ui;margin-left:6px;}
</style>
</head>
<body>
  <div id="screen">
    <div class="ground"></div>
    <div class="hud">
      chibi-walker demo
      <button id="once">walk once →</button>
      <button id="back">← walk once</button>
      <button id="toggle">start patrol</button>
    </div>
  </div>

  <!-- the ONLY thing a background needs to include: -->
  <script src="chibi-walker.js"></script>
  <script>
    var screen = document.getElementById('screen');
    var patrol = null;

    document.getElementById('once').onclick = function () {
      ChibiWalker.walk(screen, { direction:'ltr', duration:9000, height:'42%', bottom:'12%' });
    };
    document.getElementById('back').onclick = function () {
      ChibiWalker.walk(screen, { direction:'rtl', duration:9000, height:'42%', bottom:'12%' });
    };
    document.getElementById('toggle').onclick = function () {
      if (patrol) { patrol.stop(); patrol = null; this.textContent = 'start patrol'; }
      else {
        patrol = ChibiWalker.patrol(screen, {
          height:'42%', bottom:'12%', duration:9000, gapMin:1200, gapMax:3500, startDelay:0
        });
        this.textContent = 'stop patrol';
      }
    };

    // auto-start a patrol so the page shows the behaviour immediately
    patrol = ChibiWalker.patrol(screen, { height:'42%', bottom:'12%', duration:9000, gapMin:1200, gapMax:3500 });
    document.getElementById('toggle').textContent = 'stop patrol';
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>rumi — realistic redesign (preview + design notes)</title>
<!--
══════════════════════════════════════════════════════════════════════════
  rumi.html  —  the character "rumi"   (LIVE PREVIEW + DESIGN NOTES)
══════════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  ------------
  A preview page for the 2026-09 REALISTIC redesign of rumi. Unlike the old
  version of this file, the art is NOT duplicated here: the page loads the
  shipped module (chibi-walker.js — the file/global names keep the historical
  "chibi" for compatibility) and places its figure big on a neutral backdrop.
  Buttons freeze the walk cycle at each quarter phase so a single frame can be
  inspected, or let it run. The design notes below document the figure.

  RELATED FILES
  -------------
  • chibi-walker.js  — the module: the art (ChibiWalker.svgMarkup) + ALL the
      behaviour (walk/patrol API, ground shadow, blink, floating hearts, click
      reactions zap / jump / fly-out, fly ("swim") mode). Backgrounds load THAT.
  • rumi-test.html   — capability sandbox (Walk / Patrol / Zap / Jump / Fly out).
  • walker-demo.html — minimal walk-across demo.   • reef-test.html — fly mode.
  • Integrated in: savanna.bg.js (patrol, first appearing after 1-3 min of
      play), reef.bg.js (fly mode).

  THE FIGURE (viewBox "110 60 380 1345", ~6 heads tall, three-quarter view
  facing the walk direction; the module mirrors her for right-to-left)
  ---------------------------------------------------------------------------
  Kept from the earlier rumi: the purple bubble-braid high PONYTAIL (gathered
  at a hair tie on the crown), a silver hoop EARRING (near ear), the YELLOW
  BOMBER JACKET (ribbed dark collar / cuffs / hem, zipper, name-tag chest
  patch with red bars, round teal/blue sleeve patch), a round PENDANT on a
  cord, BAGGY LAVENDER PANTS with a lighter waistband, pocket seams and
  gathered ankle cuffs, WHITE SNEAKERS with PINK soles.
  After the reference picture (example.JPG): an ANIME FACE — big amber eyes
  (two-tone iris with a shaded top, dark pupil, two highlights, heavy upper
  lash line with an outer flick), thin arched brows, a tiny nose, a small
  confident smile, light blush, side-swept BANGS ending in four soft points
  above the eyes, side locks; and a WHITE CROP TOP with a bare MIDRIFF (navel)
  showing between the open jacket panels, which widen toward the hem.
  New: real proportions and anatomy — shoulders, a neck, elbows, knees, hands
  with finger lines, feet with a toe cap; soft radial/linear GRADIENT shading
  on skin, hair, jacket, pants and shoes; thin dark-plum outlines (#3a2740,
  2.2) instead of bold black.

  DRAW ORDER: hair back mass → far arm (arm-l → fore-l) → ponytail (in front of
  the far arm) → far leg (leg-l → shin-l) → near leg (leg-r → shin-r) → hips
  block (hides the thigh roots) → neck → torso (tee, jacket panels, hem,
  zipper, collar, folds, patch, pendant) → head (face, hairline shadow, updo
  crown, ponytail root + tie, bangs, side locks, ear + earring, brows,
  .chibi-eyes, nose, mouth, blush) → near arm (arm-r → fore-r) → .chibi-water ripples (fly only).

  JOINTS (viewBox units; every animated group uses transform-box:view-box)
    hips 330,790 (near) 272,790 (far) · knees 338,1050 / 280,1050
    shoulders 378,436 / 222,440 · elbows 392,604 / 222,606
    head at the neck base 312,372 · ponytail at its hair tie 262,160

  WALK CYCLE (1.24 s, two steps): thighs ±17° (near and far in anti-phase),
  knees straight at foot-strike and bent up to 40° on the forward swing; arms
  counter-swing ±20° with the elbow bending to 38° when the arm is forward; the
  body rides an inverted pendulum (lowest at foot-strike, 26 units higher at
  mid-stance); the head nods ~2°; the ponytail swings ±6°. Blink: the eyes
  squash shut for a moment every 4.2 s. In FLY mode every limb is stilled, the
  near arm points straight up (elbow straight) and three ripple rings pulse at
  the raised hand.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: system-ui, "Segoe UI", Arial; }
  body { background: linear-gradient(180deg, #f3f0f7 0%, #e6e1ee 100%); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage .chibi-walker { left: 50% !important; transform: translateX(-50%) !important; }
  .panel { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px;
           background: #ffffffd9; padding: 10px 14px; border-radius: 14px; box-shadow: 0 5px 16px #0003; z-index: 5; }
  .panel .tag { font: 700 13px system-ui; color: #3a2a6a; align-self: center; margin-right: 4px; }
  .panel button { font: 600 13px system-ui; padding: 7px 12px; border: 0; border-radius: 10px; cursor: pointer;
                  background: #7c4dff; color: #fff; }
  .panel button.ghost { background: #ece9f7; color: #3a2a6a; }
  .panel button.on { background: #ff5fa8; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="panel">
    <span class="tag">rumi preview</span>
    <button class="ghost on" data-t="run">Run</button>
    <button class="ghost" data-t="0">0%</button>
    <button class="ghost" data-t="0.25">25%</button>
    <button class="ghost" data-t="0.5">50%</button>
    <button class="ghost" data-t="0.75">75%</button>
    <button id="flip">Flip</button>
    <button id="fly">Fly pose</button>
  </div>
  <script src="chibi-walker.js"></script>
  <script>
    // place one figure, centred, standing still (a huge-duration "walk" that never gets anywhere)
    const stage = document.getElementById('stage');
    const inst = ChibiWalker.walk(stage, { height: '86%', bottom: '5%', duration: 1e9, bob: 0 });
    inst.animation.pause(); inst.animation.currentTime = 0;
    const wrap = inst.element;
    wrap.style.left = '50%'; wrap.style.transform = 'translateX(-50%)';
    // freeze / run the CSS walk cycle at a phase (0..1 of the 1.24 s loop)
    function setPhase(t){
      for (const a of document.getAnimations()){
        if (!(a instanceof CSSAnimation) || a.animationName === 'chibiBlink') continue;
        if (t === 'run'){ a.play(); continue; }
        a.pause(); a.currentTime = 1240 * t;
      }
      document.querySelectorAll('[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === String(t)));
    }
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => setPhase(b.dataset.t === 'run' ? 'run' : +b.dataset.t));
    document.getElementById('flip').onclick = () => wrap.classList.toggle('chibi-flip');
    document.getElementById('fly').onclick = e => { wrap._act.classList.toggle('chibi-arm-up'); e.target.classList.toggle('on'); };
    window._rumi = { wrap, setPhase };
  </script>
</body>
</html>

<!--
═══════════════════════════════════════════════════════════════════════════════
  rumi.html  —  the chibi character "rumi"   (DESIGN SOURCE + STANDALONE PREVIEW)
═══════════════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  ------------
  A self-contained, hand-built SVG of a kawaii / "Draw So Cute" chibi girl,
  recreated from the reference art  backgrounds/rumi/figure2.jpg .
  This file is the human-readable DESIGN SOURCE and a standalone PREVIEW: open it
  in a browser and the character stands centered on a white page, limbs gently
  walking in place.

  RELATED FILES (keep them in sync!)
  ----------------------------------
  • chibi-walker.js  — the SHIPPED, reusable module. It embeds the SAME figure
      (as a JS string) but WITHOUT the white <rect> background and WITHOUT the
      decorative hearts, plus a walk/patrol API and the same limb-animation CSS
      (injected once into <head>). Backgrounds load THAT, never this file.
      => If you change the art here, mirror the change into SVG_MARKUP there.
  • walker-demo.html — previews the "walk across the screen and exit" behaviour.
  • Integrated in:  unicorns.bg.js , savanna.bg.js  (via ChibiWalker.patrol).
  • figure2.jpg      — the original reference this was matched against.

  CANVAS & COORDINATE SYSTEM
  --------------------------
  viewBox = "0 0 600 1100".  Everything lives inside ONE wrapper <g> with:
      transform="translate(300,540) scale(1.10) translate(-300,-540) translate(0,18)"
  That = "zoom the figure to 110% about the canvas centre (300,540), then nudge
  it down a touch" so the big head sits high and the body fills the frame.
  A raw path point (x,y) therefore lands on the canvas at:
      ( 1.1*x - 30 ,  1.1*y - 34.2 )
  In RAW path coordinates the figure spans roughly  x in [172,414]  y in [199,989]
  (braid is the left-most thing; the right side hair the right-most; boot soles
  the lowest).  All the numbers in the path data below are RAW coords.

  STROKE / FILL CONVENTION
  ------------------------
  The wrapper <g> sets the house style once:  stroke #000, stroke-width 3.6,
  round joins + caps, fill none.  Every shape then sets only its own `fill`
  (flat colours) and inherits the uniform black outline; a few thin detail
  strokes override stroke/stroke-width locally. Result: clean bold-outline,
  flat-fill kawaii look.

  DRAW ORDER  (painter's model — later shapes paint ON TOP)
  ---------------------------------------------------------
   1. HAIR behind face .. two side "frame locks" framing the cheeks (behind all).
   2. BRAID ............. viewer-LEFT braid, drawn EARLY on purpose so the face
                         + arm occlude its middle -> it reads as coming from
                         BEHIND the head. Ends in a gold band + a soft rounded
                         gold TASSEL (deliberately not a blade).
   3. FACE ............. the pink rounded face silhouette.
   4. HAIRLINE ......... pointed sideburn locks + a central band with a gentle
                         widow's-peak dip (drawn over the face edges).
   5. TOP BUN .......... the LOWERED pompadour: a back/side roll mass + a front
                         heart/leaf lobe + darker-purple (#7d2ea8) fold seams.
                         (Compressed to ~0.7x height around the hairline to sit
                         low like the reference — see "EDITING".)
   6. EARS + EARRINGS .. small skin ears at cheek level (on top of the side hair)
                         with gold hoop earrings hanging from the lobes.
   7. EYEBROWS ......... thin arcs, sitting close above the eyes.
   8. EYES ............. big near-round black ovals, each with two white
                         highlights, plus small outer eyelashes.
   9. BLUSH ............ soft pink cheek ovals (kept inside the face outline).
  10. MOUTH ............ small smile.
  11. NECK ............ short skin neck.
  12. ARMS ............ <g class="arm-l"> / <g class="arm-r"> — fuller arms with
                         rounded mitten HANDS (subtle inner thumb). ANIMATED.
  13. TOP ............. white halter CROP tank: high neckline, thin collar band,
                         gold diamond gem + tiny pendant.
  14. MIDRIFF ......... bare skin strip between top and shorts.
  15. SHORTS .......... white shorts + gold belt & buckle + diagonal gold sash.
  16. LEGS ............ <g class="leg-l"> / <g class="leg-r"> — each = thigh +
                         white knee boot + gold sole + cuff + gold ladder laces
                         + lace eyelets. ANIMATED.

  COLOUR PALETTE
  --------------
    hair          #a83fce      hair fold seams   #7d2ea8
    skin          #f7c9c1      blush             #f3a3ad
    eyes          #1a1a1a      eye highlights    #ffffff
    gold (gem/belt/sash/earrings/boot trim)      #efc14b
    braid tassel inner strands                   #c79a2e
    whites (top / shorts / boots)                #ffffff
    outlines                                     #000000

  ANIMATION  (the <style> block below)
  ------------------------------------
  The four limb groups carry classes arm-l / arm-r / leg-l / leg-r. Each uses
  `transform-box: fill-box` + a `transform-origin` near the TOP of its own box
  so it rotates about the SHOULDER (arms, 50% 6%) or the HIP (legs, 50% 2%).
  Keyframes armA/armB rotate +/-12 deg, legA/legB +/-7 deg, mirrored L/R and
  phased so the arms and opposite legs swing together — a simple diagonal walk.
  1.5s loop.  NOTE: a `@media (prefers-reduced-motion: reduce)` rule that
  switched the animation OFF was intentionally REMOVED, so the character always
  moves even when the OS "reduce motion" setting is on. Do not re-add it.

  EDITING — QUICK MAP
  -------------------
  • Hair colour  -> replace #a83fce (and seam #7d2ea8) everywhere.
  • Bun height   -> the "TOP BUN" paths were compressed ~0.7x in y around the
                    hairline (~y310). The mapping used was  y' = 0.7*y + 93 ;
                    retune those y's to raise/lower the bun further.
  • Eye size     -> the two EYES <ellipse rx ry> (currently 29 x 30, near-round).
  • Brow height  -> shift the EYEBROWS path y's (lower y = closer to the eyes).
  • Blush        -> the BLUSH <ellipse cx/cy> (keep inside the face outline).
  • Walk feel    -> edit the @keyframes angles / the 1.5s duration in <style>.

  PROVENANCE
  ----------
  Built by matching figure2.jpg through several iterative judge-panel passes
  (proportions -> hair -> arms -> outfit/boots/ears). The decorative hearts that
  floated around the head in the reference were removed for in-game use.
═══════════════════════════════════════════════════════════════════════════════
-->
<style>
  html,body{margin:0;height:100%;background:#ffffff;}
  body{display:flex;align-items:center;justify-content:center;}
  svg{height:96vh;max-width:96vw;display:block;}

  /* --- limb animation: swing arms + step legs, pivoting at shoulder / hip --- */
  .arm-l,.arm-r,.leg-l,.leg-r{transform-box:fill-box;}
  .arm-l{transform-origin:50% 6%;  animation:armA 1.5s ease-in-out infinite;}
  .arm-r{transform-origin:50% 6%;  animation:armB 1.5s ease-in-out infinite;}
  .leg-l{transform-origin:50% 2%;  animation:legA 1.5s ease-in-out infinite;}
  .leg-r{transform-origin:50% 2%;  animation:legB 1.5s ease-in-out infinite;}
  /* diagonal coordination: left arm forward with right leg, and vice-versa */
  @keyframes armA{0%,100%{transform:rotate(12deg)}  50%{transform:rotate(-12deg)}}
  @keyframes armB{0%,100%{transform:rotate(-12deg)} 50%{transform:rotate(12deg)}}
  @keyframes legA{0%,100%{transform:rotate(-7deg)}  50%{transform:rotate(7deg)}}
  @keyframes legB{0%,100%{transform:rotate(7deg)}   50%{transform:rotate(-7deg)}}

  /* blink: the eyes group squashes shut briefly every few seconds */
  .chibi-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:chibiBlink 4.2s ease-in-out infinite;}
  @keyframes chibiBlink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
  /* floating hearts emote: each heart rises + fades, staggered */
  .chibi-hearts path{transform-box:fill-box;opacity:0;animation:chibiHeart 2.8s ease-in infinite;}
  .chibi-hearts path:nth-child(2){animation-delay:.95s}
  .chibi-hearts path:nth-child(3){animation-delay:1.9s}
  @keyframes chibiHeart{0%{opacity:0;transform:translateY(8px) scale(.4)}20%{opacity:.95;transform:translateY(0) scale(1)}70%{opacity:.8}100%{opacity:0;transform:translateY(-42px) scale(1.1)}}
</style>

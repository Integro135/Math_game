═══════════════════════════════════════════════════════════════════════════════
  rumi.html  —  the chibi character "rumi"   (DESIGN SOURCE + STANDALONE PREVIEW)
═══════════════════════════════════════════════════════════════════════════════

  WHAT THIS IS
  ------------
  A self-contained, hand-built SVG of a chibi girl, recreated from the July-2026
  reference picture: purple bubble-ponytail + swirled updo, confident face with
  purple-iris eyes, YELLOW bomber jacket with chest patches over a white tee +
  round pendant, baggy light-purple pants and white sneakers with pink soles.
  (This REPLACED the earlier white-outfit design that was matched to figure2.jpg.)
  This file is the human-readable DESIGN SOURCE and a standalone PREVIEW: open it
  in a browser and the character stands centered on a white page, limbs gently
  walking in place.

  RELATED FILES (keep them in sync!)
  ----------------------------------
  • chibi-walker.js  — the SHIPPED, reusable module: it embeds the SAME figure
      (as a JS string, transparent background) and carries ALL of rumi's
      behaviour — walk/patrol API, ground shadow, blink, floating hearts, and the
      click reactions (zap / jump / fly-out). Backgrounds load THAT, never this
      file.  => If you change the ART here, mirror it into SVG_MARKUP there.
  • rumi-test.html   — capability sandbox: buttons for Walk / Patrol / Zap / Jump
      / Fly out / Hearts (the easiest way to see every behaviour).
  • walker-demo.html — minimal "walk across and exit" demo.
  • reef-test.html   — the FLY ('swim') mode sandbox.
  • Integrated in:  unicorns.bg.js , savanna.bg.js , dinosaurs.bg.js (patrols,
      first appearing only after 1-3 min of play), reef.bg.js (fly mode).

  NOTE: this preview shows the static art + the CSS animations (walk, blink,
  hearts, shadow). The interactive click reactions (zap / jump / fly-out) and the
  random/grounded behaviour live in chibi-walker.js — open rumi-test.html for them.

  CANVAS & COORDINATE SYSTEM
  --------------------------
  viewBox = "0 0 600 1100".  Everything lives inside ONE wrapper <g> with:
      transform="translate(300,540) scale(1.10) translate(-300,-540) translate(0,18)"
  That = "zoom the figure to 110% about the canvas centre (300,540), then nudge
  it down a touch" so the big head sits high and the body fills the frame.
  A raw path point (x,y) therefore lands on the canvas at:
      ( 1.1*x - 30 ,  1.1*y - 34.2 )
  In RAW path coordinates the figure spans roughly  x in [165,398]  y in [164,989]
  (ponytail bubbles are the left-most thing; sneaker soles the lowest).
  IMPORTANT: chibi-walker.js tightens the viewBox to "150 140 300 930", so keep
  raw x >= 165 and raw y >= 160 (transformed: x>=151, y>=142) or the art clips.
  All the numbers in the path data below are RAW coords.

  STROKE / FILL CONVENTION
  ------------------------
  The wrapper <g> sets the house style once:  stroke #000, stroke-width 3.6,
  round joins + caps, fill none.  Every shape then sets only its own `fill`
  (flat colours) and inherits the uniform black outline; a few thin detail
  strokes override stroke/stroke-width locally. Result: clean bold-outline,
  flat-fill kawaii look.

  DRAW ORDER  (painter's model — later shapes paint ON TOP)
  ---------------------------------------------------------
   0. GROUND SHADOW .... a soft flat ellipse under the feet, drawn FIRST so it
                         sits behind everything (grounds her). In chibi-walker.js
                         it's a separate grounded layer, so it stays put on jumps.
   1. PONYTAIL TOP ..... the FIRST (biggest) bubble of the ponytail, beside the
                         head — drawn EARLY so the face + hair dome occlude it
                         -> it reads as gathered from BEHIND the updo.
   2. HAIR behind face .. two side "frame locks" framing the cheeks.
   3. FACE ............. the rounded face silhouette.
   4. HAIRLINE ......... pointed sideburn locks in front of the ears (drawn over
                         the face edges).
   5. UPDO ............. the big swirled quiff dome + a pointed swirl flick at
                         the top-left + darker-purple (#8138ad) swirl seams.
                         The dome's BOTTOM edge is the hairline and dips to a
                         soft widow's peak at (300,312).
   6. EARS + EARRING ... small skin ears at cheek level; a SILVER hoop earring
                         on the viewer-LEFT ear only (matches the reference).
   7. EYEBROWS ......... dark-purple FILLED tapered wedges close above the eyes.
   8. EYES ............. anime style: white sclera + big two-tone PURPLE iris
                         (darker base + lighter inner glow) + deep pupil + big
                         round highlight + small sparkle + a HEAVY top lid line
                         clipping the iris top + outer lash flicks.
   9. MOUTH ............ small asymmetric smirk (no blush — reference has none).
  10. NECK ............ short skin neck.
  11. ARMS ............ <g class="arm-l"> / <g class="arm-r"> — yellow bomber
                         SLEEVES + dark ribbed cuff + skin mitten hand (subtle
                         inner thumb). ANIMATED at the shoulder.
  12. TEE + NECKLACE .. white-pink tee strip (centre) + cord & round pendant.
  13. JACKET .......... two yellow front panels (open front shows the tee) +
                         dark collar band + chest patches: viewer-left a dark
                         name tag with red text bars, viewer-right a colourful
                         abstract logo patch.
  14. PONYTAIL FRONT ... bubbles 2-5 + the pointed tail tip, drawn AFTER the arm
                         and jacket so the chain hangs IN FRONT of the sleeve
                         (like the reference). Seam arcs shade each bubble.
  15. PANTS (hips) ..... baggy light-purple hip block + lighter waistband +
                         curved front-pocket seams.
  16. LEGS ............ <g class="leg-l"> / <g class="leg-r"> — each = baggy
                         pant leg + gathered ankle cuff + white sneaker with a
                         PINK sole + toe seam + grey laces. ANIMATED at the hip.
  17. HEARTS .......... <g class="chibi-hearts"> big red hearts above the head.
                         Here they loop for the preview; in chibi-walker.js they
                         are spawned in bursts on a random timer + on click.

  ANIMATION  (the <style> block below)
  ------------------------------------
  WALK (limbs): the four limb groups carry classes arm-l / arm-r / leg-l / leg-r.
  Each uses `transform-box: fill-box` + a `transform-origin` near the TOP of its
  own box so it rotates about the SHOULDER (arms, 50% 6%) or the HIP (legs, 50%
  2%). Keyframes armA/armB rotate +/-12 deg, legA/legB +/-7 deg, mirrored L/R and
  phased so the arms and opposite legs swing — a simple diagonal walk, 1.5s loop.
  BLINK: the .chibi-eyes group squashes shut (scaleY) briefly every ~4s.
  HEARTS: the .chibi-hearts float up + fade (here on a CSS loop, for the preview).
  NOTE: a `@media (prefers-reduced-motion: reduce)` rule that switched the
  animation OFF was intentionally REMOVED, so she always moves even when the OS
  "reduce motion" setting is on. Do not re-add it.

  Behaviours that live ONLY in chibi-walker.js (not in this preview):
   - the cross-screen WALK / PATROL motion + the grounded shadow during jumps,
   - CLICK reactions: pop hearts + a random zap (35%) / jump (35%) / fly-out (30%),
   - hearts fired on a random timer + on click (not a constant loop, in-game).

  EDITING — QUICK MAP
  -------------------
  • Hair colour  -> replace #ad5fd6 (and seam #8138ad) everywhere.
  • Jacket       -> #f4c142 body/sleeves; trim #423a45 (collar + cuffs).
  • Ponytail     -> bubbles 1-5 are plain <ellipse>; tail tip is the last path
                    of the PONYTAIL FRONT group. Keep bubble x >= 166 (clip!).
  • Eye size     -> the sclera <ellipse rx ry> (30 x 28) + iris r=23, pupil 9.5;
                    the inner glow circle sits 7 lower than the iris centre.
  • Brow height  -> shift the EYEBROWS path y's (lower y = closer to the eyes).
  • Smirk        -> the MOUTH path (asymmetric: rises to the viewer-right).
  • Walk feel    -> edit the @keyframes angles / the 1.5s duration in <style>.
  • Shadow       -> the GROUND SHADOW <ellipse> here / the .chibi-shadow CSS in
                    chibi-walker.js.
  • Hearts size  -> the HEARTS <path>s here / heartD()'s size in chibi-walker.js.
  • Click odds / fly-out / jump -> chibi-walker.js (triggerAction, doJump,
                    doFlyOut); first-appearance delay -> startDelay in the bg files.

  PROVENANCE
  ----------
  July 2026: full art redesign matched against the new "rumi" reference picture
  (chibi girl: purple bubble ponytail, yellow bomber with patches, purple baggy
  pants, white/pink sneakers). The walk/blink/hearts/click behaviour and the
  whole skeleton (limb groups, class names, wrapper transform, pivots) were kept
  from the previous design so every background keeps working unchanged.

<style>
  html,body{margin:0;height:100%;background:#ffffff;}
  body{display:flex;align-items:center;justify-content:center;}
  svg{height:96vh;max-width:96vw;display:block;}

  /* --- limb animation: swing arms + step legs, pivoting at shoulder / hip --- */
  .arm-l,.arm-r,.leg-l,.leg-r{transform-box:fill-box;}
  .arm-l{transform-origin:50% 6%;  animation:armA 1.5s ease-in-out infinite;}
  .arm-r{transform-origin:50% 6%;  animation:armB 1.5s ease-in-out infinite;}
  .leg-l{transform-origin:50% 2%;  animation:legA 1.5s ease-in-out infinite;}
  .leg-r{transform-origin:50% 2%;  animation:legB 1.5s ease-in-out infinite;}
  /* diagonal coordination: left arm forward with right leg, and vice-versa
     (bomber sleeves swing a touch less than the old bare arms did: 9deg) */
  @keyframes armA{0%,100%{transform:rotate(9deg)}  50%{transform:rotate(-9deg)}}
  @keyframes armB{0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)}}
  @keyframes legA{0%,100%{transform:rotate(-7deg)}  50%{transform:rotate(7deg)}}
  @keyframes legB{0%,100%{transform:rotate(7deg)}   50%{transform:rotate(-7deg)}}

  /* blink: the eyes group squashes shut briefly every few seconds */
  .chibi-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:chibiBlink 4.2s ease-in-out infinite;}
  @keyframes chibiBlink{0%,93%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
  /* floating hearts emote: each heart rises + fades, staggered */
  .chibi-hearts path{transform-box:fill-box;opacity:0;animation:chibiHeart 2.8s ease-in infinite;}
  .chibi-hearts path:nth-child(2){animation-delay:.95s}
  .chibi-hearts path:nth-child(3){animation-delay:1.9s}
  @keyframes chibiHeart{0%{opacity:0;transform:translateY(8px) scale(.4)}20%{opacity:.95;transform:translateY(0) scale(1)}70%{opacity:.8}100%{opacity:0;transform:translateY(-42px) scale(1.1)}}
</style>

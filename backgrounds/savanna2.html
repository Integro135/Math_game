<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savanna 2 — Dev Harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     Thin development harness for the SAVANNA2 background module. The scene
     lives in savanna2.bg.js — the SAME file the game loads (single source of
     truth); the animals are the canvas rigs in savanna_rigs/. The buttons
     poke window._sav2: the hour keys, Pause / Fast ×20, a herd of each kind,
     Roar (the lion), Trick (everyone on stage does one), Birds, Restart.
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #d9a64e; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; top: 40px; right: 18px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 62vw; direction: ltr; }
  #bar button {
    padding: 7px 14px;
    background: rgba(70, 30, 10, 0.45); color: rgba(255, 240, 220, 0.92);
    border: 1px solid rgba(255, 200, 120, 0.35); border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 4px 18px rgba(40, 20, 0, 0.45); transition: background .2s;
  }
  #bar button:hover { background: rgba(140, 70, 20, 0.6); }
  #bar button.on { background: rgba(255, 194, 77, 0.35); border-color: rgba(255, 220, 140, 0.7); }
  #clock { position: fixed; top: 14px; right: 18px; z-index: 10; color: rgba(255,255,255,.85); font: 12px/1.4 Georgia, serif; letter-spacing: .12em; text-shadow: 0 1px 4px rgba(0,0,0,.6); text-align: right; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="clock"></div>
<div id="bar">
  <button data-tod="0.03">Dawn</button>
  <button data-tod="0.16">Morning</button>
  <button data-tod="0.36">Noon</button>
  <button data-tod="0.55">Golden</button>
  <button data-tod="0.67">Sunset</button>
  <button data-tod="0.77">Dusk</button>
  <button data-tod="0.90">Night</button>
  <button id="pause">Pause</button>
  <button id="fast">Fast</button>
  <button data-herd="zebra">Zebras</button>
  <button data-herd="giraffe">Giraffes</button>
  <button data-herd="elephant">Elephants</button>
  <button data-herd="ostrich">Ostriches</button>
  <button data-herd="cheetah">Cheetahs</button>
  <button data-herd="lioness">Lionesses</button>
  <button id="roar">Roar</button>
  <button id="trick">Trick</button>
  <button id="birds">Birds</button>
  <button id="restart">Restart</button>
</div>
<script src="savanna2.bg.js"></script>
<script>
let cleanup = null, paused = false, fast = false;
const $ = id => document.getElementById(id), T = () => window._sav2;
function start(){ if (cleanup) cleanup(); cleanup = window.BACKGROUNDS.savanna2.init({ stage: $('stage') }); }
document.querySelectorAll('[data-tod]').forEach(b => b.onclick = e => { e.stopPropagation(); T().setTod(+b.dataset.tod); });
document.querySelectorAll('[data-herd]').forEach(b => b.onclick = e => { e.stopPropagation(); T().spawn(b.dataset.herd); });
$('pause').onclick = e => { e.stopPropagation(); paused = !paused; e.target.classList.toggle('on', paused); T().setSpeed(paused ? 0 : (fast ? 20 : 1)); };
$('fast').onclick = e => { e.stopPropagation(); fast = !fast; e.target.classList.toggle('on', fast); T().setSpeed(paused ? 0 : (fast ? 20 : 1)); };
$('roar').onclick = e => { e.stopPropagation(); T().act('lion', 'pose'); };
$('trick').onclick = e => { e.stopPropagation(); const n = T().pride().length + T().herds().reduce((a, h) => a + h.members.length, 0); for (let i = 0; i < n; i++) T().act(i, ['pose', 'jump', 'fart', 'spin'][i % 4]); };
$('birds').onclick = e => { e.stopPropagation(); const p = T().baobabXY(); document.elementFromPoint(p.x, p.y).dispatchEvent(new MouseEvent('click', { bubbles: true, clientX: p.x, clientY: p.y })); };
$('restart').addEventListener('click', e => { e.stopPropagation(); start(); });
setInterval(() => {
  if (!T()) return;
  const t = T().tod(), p = T().perf(), h = (5 + t * 24) % 24;
  $('clock').textContent =
    T().phase().toUpperCase() + ' · ' + String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0') +
    '  |  animals ' + p.animals + '  |  ' + (p.halfRate ? '½ rate' : 'full') + ' ' + p.costEma.toFixed(1) + ' ms';
}, 250);
start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reef creatures (painted) — dev sheet</title>
<!-- Dev sheet for reef_rigs/painted.js: every creature, large and in motion, on plain
     water. Click anywhere to play every trick (pose 0 → 1); add #still to the URL to
     freeze the swim phase (for stills). The scene that uses them is reef4.bg.js. -->
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#0b4f9e}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="painted.js"></script>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
const SHOW = [                                   // [rig, x, y (fractions of a 1400×900 sheet), scale, coat index, extra]
  ['TurtleRig', 0.2, 0.2, 1.5, 0], ['DolphinRig', 0.68, 0.2, 1.4, 0], ['SharkRig', 0.26, 0.5, 1.3, 0], ['OctopusRig', 0.72, 0.66, 1.7, 0],
  ['SeahorseRig', 0.1, 0.8, 1.9, 0], ['CrabRig', 0.3, 0.95, 1.9, 0], ['PufferRig', 0.5, 0.8, 1.6, 0], ['PufferRig', 0.9, 0.84, 1.3, 1, { puff: 1 }],
  ['OctopusRig', 0.9, 0.42, 0.9, 2], ['SeahorseRig', 0.185, 0.8, 1.2, 1], ['CrabRig', 0.42, 0.95, 1.1, 3],
];
let poseT0 = -99;
addEventListener('click', () => { poseT0 = performance.now() / 1000; });
function frame(ms){
  const t = ms / 1000, W = cv.width = innerWidth, H = cv.height = innerHeight, k = Math.min(W / 1400, H / 900);
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#1e8fd0'); bg.addColorStop(1, '#0b3f86'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = '#e6d6a8'; g.fillRect(0, H * 0.95, W, H * 0.05);
  const still = location.hash.indexOf('still') >= 0, wt = still ? 0.9 : t * 3.2;
  for (const [name, fx, fy, s, ci, extra] of SHOW){
    const R = window[name]; if (!R) continue;
    const pose = Math.max(0, Math.min(1, (t - poseT0) / R.ACT_SECONDS)), L = Object.assign({ x: fx * W, y: fy * H, s: s * k, dir: 1, wt, pose: pose >= 1 ? 0 : pose, coat: R.COATS[ci % R.COATS.length] }, extra || {});
    R.draw(g, L, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maldives v2 — Dev Harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     Thin development harness for the MALDIVES v2 background module.
     The actual scene lives in maldives2.bg.js — the SAME file the game loads
     dynamically (single source of truth). The buttons poke window._mv2:
     the hour keys (Dawn … Night), Pause / Fast ×20, Storm (force a squall),
     Bolt (one strike), Clear (end the storm), Walk (the next pokemon comes
     out), Fly (the gooey ghost), Restart.
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0b3a5a; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; bottom: 18px; right: 18px; z-index: 10; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 70vw; }
  #bar button {
    padding: 7px 14px;
    background: rgba(6, 40, 70, 0.45); color: rgba(200, 245, 255, 0.92);
    border: 1px solid rgba(120, 220, 240, 0.35); border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; box-shadow: 0 4px 18px rgba(2, 20, 40, 0.45); transition: background .2s;
  }
  #bar { direction: ltr; }   /* the RTL button flips the page like the game; the bar itself stays put */
  #bar button:hover { background: rgba(20, 90, 130, 0.6); }
  #bar button.on { background: rgba(255, 194, 77, 0.35); border-color: rgba(255, 220, 140, 0.7); }
  #clock { position: fixed; top: 14px; right: 18px; z-index: 10; color: rgba(255,255,255,.85); font: 12px/1.4 Georgia, serif; letter-spacing: .12em; text-shadow: 0 1px 4px rgba(0,0,0,.6); text-align: right; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="clock"></div>
<div id="bar">
  <button class="hbtn" data-tod="0.04">Dawn</button>
  <button class="hbtn" data-tod="0.16">Morning</button>
  <button class="hbtn" data-tod="0.34">Noon</button>
  <button class="hbtn" data-tod="0.56">Golden</button>
  <button class="hbtn" data-tod="0.70">Sunset</button>
  <button class="hbtn" data-tod="0.80">Dusk</button>
  <button class="hbtn" data-tod="0.91">Night</button>
  <button id="pause">Pause</button>
  <button id="fast">Fast</button>
  <button id="storm">Storm</button>
  <button id="bolt">Bolt</button>
  <button id="clear">Clear</button>
  <button id="walk">Walk</button>
  <button id="fly">Fly</button>
  <button class="pk" data-pk="eevee">Eevee</button>
  <button class="pk" data-pk="pikachu">Pikachu</button>
  <button class="pk" data-pk="bulbasaur">Bulbasaur</button>
  <button class="pk" data-pk="squirtle">Squirtle</button>
  <button class="pk" data-pk="jigglypuff">Jigglypuff</button>
  <button id="rtl" title="the game is Hebrew (dir=rtl) — toggle it here to see the rigs the way the game shows them">RTL</button>
  <button id="restart">Restart</button>
</div>
<script src="maldives2.bg.js"></script>
<script>
let cleanup = null, paused = false, fast = false;
function start(){ if (cleanup) cleanup(); cleanup = window.BACKGROUNDS.maldives2.init({ stage: document.getElementById('stage') }); }
document.querySelectorAll('[data-tod]').forEach(b => b.onclick = e => { e.stopPropagation(); window._mv2 && window._mv2.setTod(+b.dataset.tod); });
document.getElementById('pause').onclick = e => { e.stopPropagation(); paused = !paused; e.target.classList.toggle('on', paused); window._mv2.setSpeed(paused ? 0 : (fast ? 20 : 1)); };
document.getElementById('fast').onclick = e => { e.stopPropagation(); fast = !fast; e.target.classList.toggle('on', fast); window._mv2.setSpeed(paused ? 0 : (fast ? 20 : 1)); };
document.getElementById('storm').onclick = e => { e.stopPropagation(); window._mv2.storm(); };
document.getElementById('bolt').onclick = e => { e.stopPropagation(); window._mv2.bolt(); };
document.getElementById('clear').onclick = e => { e.stopPropagation(); window._mv2.clearStorm(); };
document.getElementById('walk').onclick = e => { e.stopPropagation(); window._mv2.walk(); };
// summon one pokemon by name, parked mid-beach for a close look (its idle show keeps running)
document.querySelectorAll('.pk').forEach(b => b.onclick = e => { e.stopPropagation(); window._mv2.clear(); window._mv2.walk(b.dataset.pk, 0.2); });   // parked on the open sand, clear of this bar
// the game page is <html dir="rtl">; the rigs must look identical either way
document.getElementById('rtl').onclick = e => { e.stopPropagation(); const on = document.documentElement.dir !== 'rtl'; document.documentElement.dir = on ? 'rtl' : 'ltr'; e.target.classList.toggle('on', on); };
document.getElementById('fly').onclick = e => { e.stopPropagation(); window._mv2.fly(); };
document.getElementById('restart').addEventListener('click', e => { e.stopPropagation(); start(); });
setInterval(() => {
  if (!window._mv2) return;
  const t = window._mv2.tod(), st = window._mv2.stormState(), p = window._mv2.perf();
  const h = (5 + t * 24) % 24;
  document.getElementById('clock').textContent =
    window._mv2.phase().toUpperCase() + ' · ' + String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0') +
    '  |  storm ' + st.phase + ' ' + st.k + '  |  ' + (p.halfRate ? '½ rate' : 'full') + ' ' + p.costEma + ' ms';
}, 250);
start();
</script>
</body>
</html>

@charset "UTF-8";
/*

Slow-mo lives in the panel; CLICKING the unicorn casts horn lightning
(and every few clicks… a rainbow toot 💨)

*/
:root {
  font-size: 22vmin;
  --outlines: transparent;
  --speed: 0.8s;
  --delay-gap: 8;
  --horse-width: 3.8rem;
  --horse-height: 2.5rem;
  --color-horse: rgba(50, 50, 50, 1);
  --color-horse-back: rgba(30, 30, 30, 1);
  --color-hair: rgba(70, 70, 70, 1);
  --color-hoof: rgba(0, 0, 0, 1);
  --color-dust: #AF540B;
  --color-floor: #F1D1AF;
  --color-sky: #C4C4FF;
}

input[type=checkbox] {
  opacity: 0;
}

input[type=checkbox]:checked ~ label {
  --outlines: white;
  --speed: 8s;
  --color-horse: rgba(50, 50, 50, 0.3);
  --color-horse-back: rgba(30, 30, 30, 0.3);
  --color-hair: rgba(70, 70, 70, 0.3);
  --color-hoof: rgba(0, 0, 0, 0.3);
}

* {
  position: relative;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  background: -webkit-gradient(linear, left bottom, left top, color-stop(30%, #ffa44e), to(#00d4ff));
  background: linear-gradient(0deg, #ffa44e 30%, #00d4ff 100%);
}

body {
  display: -webkit-box;
  display: flex;
  -webkit-box-pack: center;
          justify-content: center;
  -webkit-box-align: center;
          align-items: center;
}

label {
  cursor: pointer;
}

.dust {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: calc(((100vh - var(--horse-height)) / 2) + 0.02rem);
  overflow: hidden;
}

.floor {
  background-color: var(--color-floor);
  background: linear-gradient(9deg, #e8d9be 0%, #A95108 100%);
  position: fixed;
  top: calc(50vh + (var(--horse-height) / 2) - 0.5rem);
  left: 0;
  right: 0;
  bottom: 0;
  overflow: hidden;
}

.dust .particle {
  background-color: var(--color-dust);
  width: 0.05rem;
  height: 0.05rem;
  border-radius: 50%;
  position: absolute;
  border: 1px dashed var(--outlines);
  top: calc(50vh + (var(--horse-height) / 2) - 0.05rem);
  left: calc(50vw - (var(--horse-width) / 2) + (var(--horse-width) * 0.15));
}

.dust.back .particle {
  left: calc(50vw - (var(--horse-width) / 2) + (var(--horse-width) * 0.5));
}

/* ═══════════════════════════════════════════════════════════════════════
   UNICORN OVERRIDES — everything below turns the galloping horse rig into
   a pearl-white unicorn: colors, golden spiral horn, flowing rainbow mane,
   rainbow tail and golden stardust. The rig itself is untouched above.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --color-horse:#fff6fb;            /* pearl-white coat */
  --color-horse-back:#e2d0f0;       /* far-side legs — soft lilac shadow */
  --color-hair:#ff8fc8;             /* base hair (tail depths override it) */
  --color-hoof:#e9b64f;             /* golden hooves */
  --color-dust:#ffd27d;             /* golden stardust */
  --color-floor:#efe0ff;
  --color-sky:#d9c6ff;
}
/* deliberately-minimal backdrop: soft dusk sky + pastel ground */
html, body{background:linear-gradient(0deg, #eed4f6 25%, #c7b1f0 100%)}
.floor{background:linear-gradient(9deg, #f6e7fb 0%, #cbb0ec 100%)}

/* the slow-mo click keeps the pretty colors (no debug x-ray) */
input[type=checkbox]:checked ~ label{
  --outlines:transparent;
  --color-horse:#fff6fb; --color-horse-back:#e2d0f0;
  --color-hair:#ff8fc8;  --color-hoof:#e9b64f;
}

/* a pearl body over a light sky needs a whisper of depth */
.🐴{filter:drop-shadow(0 0.03rem 0.05rem rgba(110,70,160,.35))}

/* big KAWAII eye — anime-style: a big round iris with a glowing gradient
   (lighter at the bottom), a LARGE catch-light + a tiny lower sparkle,
   three little LASHES at the outer corner, and a rosy blush on the cheek.
   She BLINKS on a long cycle — the squash rides transform, so the glints
   blink with it. */
.head .eye{
  background-color:#fff;                        /* WHITE sclera */
  --shape-width:14.5%; --shape-height:26%; --shape-radius:50%;
  --shape-x:40.5%; --shape-y:12%; --shape-origin:50% 60%;
  border:none;
  box-shadow:0 0 0 0.011rem rgba(61,39,82,.45); /* soft rim so it reads on the pale coat */
}
.head .eye:before{                              /* BIG round pupil, anime bottom-glow */
  content:'';
  --shape-width:68%; --shape-height:68%; --shape-radius:50%;
  --shape-x:18%; --shape-y:22%;
  background-color:#3d2752;
  background-image:radial-gradient(circle at 50% 78%, #8a67b5 0%, #5c3f80 40%, #3d2752 75%);
  border:none;
}
.head .eye:after{                               /* catch-light on the pupil + a mini twin */
  content:'';
  --shape-width:24%; --shape-height:22%; --shape-radius:50%;
  --shape-x:28%; --shape-y:30%;
  background-color:#fff; border:none;
  box-shadow:0.05rem 0.055rem 0 -0.01rem rgba(255,255,255,.85);
}
/* three lashes fanning from the eye's outer top corner (one div + 2 pseudos) */
.head .lash{
  --shape-width:8%; --shape-height:3.2%;
  --shape-x:54.5%; --shape-y:12%;
  --shape-radius:40% / 50%;
  --shape-rotate:-34deg; --shape-origin:0% 50%;
  background-color:#3d2752; border:none;
}
.head .lash:before{
  content:'';
  --shape-width:92%; --shape-height:100%;
  --shape-x:12%; --shape-y:-190%;
  --shape-rotate:24deg; --shape-origin:0% 50%;
  background-color:#3d2752; border:none;
}
.head .lash:after{
  content:'';
  --shape-width:80%; --shape-height:100%;
  --shape-x:24%; --shape-y:180%;
  --shape-rotate:-14deg; --shape-origin:0% 50%;
  background-color:#3d2752; border:none;
}
.head .blush{
  --shape-width:17%; --shape-height:28%; --shape-x:23%; --shape-y:36%;
  --shape-radius:50%; border:none;
  background:radial-gradient(circle, rgba(255,120,175,.55), rgba(255,120,175,0) 72%);
}
@keyframes uni-blink{
  0%,41%,45%,74%,78%,82%,100%{transform:scaleY(1)}
  43%{transform:scaleY(.06)}
  76%,80%{transform:scaleY(.06)}
}
.animate .head .eye{animation:uni-blink 6.4s linear infinite}
.head .eye:after{
  content:'';
  --shape-width:34%; --shape-height:30%;
  --shape-x:18%; --shape-y:16%;
  --shape-radius:50%;
  background-color:#fff; border:none;
}

/* ── golden spiral horn (rides the .animate .head keyframes) ──
      RICH gold: a metallic left-to-right sheen (dark→bright→dark) under
      amber spiral bands with pale-gold highlights */
.head .horn{
  --shape-width:12%; --shape-height:130%;
  --shape-x:57%; --shape-y:-112%;
  --shape-rotate:16deg; --shape-origin:50% 100%;
  background-color:#f2a814;
  background-image:
    repeating-linear-gradient(-56deg,
      rgba(255,240,175,.95) 0 10%, rgba(178,108,6,.85) 10% 23%, rgba(255,200,70,.25) 23% 38%),
    linear-gradient(90deg, #a86e06, #ffd23e 38%, #ffedaa 52%, #e8a916 78%, #96600a);
  clip-path:polygon(50% 0%, 88% 100%, 12% 100%);
  border:none;
  filter:drop-shadow(0 0 0.05rem rgba(255,196,64,.95));
}
/* the horn breathes golden light as she moves */
@keyframes horn-glow{
  0%,100%{filter:drop-shadow(0 0 0.035rem rgba(255,196,64,.8)) saturate(1.05)}
  50%    {filter:drop-shadow(0 0 0.1rem rgba(255,214,90,1)) saturate(1.25)}
}
.animate .horn{animation:horn-glow calc(var(--speed)*2) ease-in-out infinite}
/* pink forelock tucked at the horn base */
.head .forelock{
  --shape-width:22%; --shape-height:36%;
  --shape-x:56%; --shape-y:-8%;
  --shape-rotate:38deg;
  --shape-radius:65% 35% 70% 30% / 55% 45% 55% 45%;
  background-color:#ff8fc8; border:none;
}

/* ── flowing rainbow mane (rides the .animate .neck keyframes) ── */
.neck .mane{
  --shape-x:0%; --shape-y:0%; --shape-width:100%; --shape-height:100%;
  background-color:transparent; border:none;
}
.neck .mane b{
  border:none;
  --shape-origin:50% 12%;
  --shape-radius:52% 48% 58% 42% / 30% 30% 70% 70%;
}
.neck .mane b:nth-child(1){--shape-x:-2%;  --shape-y:-26%; --shape-width:15%; --shape-height:58%; --shape-rotate:24deg;  --delay:0s;    background-color:#ff77b8}
.neck .mane b:nth-child(2){--shape-x:11%;  --shape-y:-30%; --shape-width:16%; --shape-height:64%; --shape-rotate:26deg;  --delay:-.09s; background-color:#ffa564}
.neck .mane b:nth-child(3){--shape-x:24%;  --shape-y:-32%; --shape-width:16%; --shape-height:66%; --shape-rotate:28deg;  --delay:-.18s; background-color:#ffe066}
.neck .mane b:nth-child(4){--shape-x:37%;  --shape-y:-30%; --shape-width:16%; --shape-height:64%; --shape-rotate:31deg;  --delay:-.27s; background-color:#7ee6a0}
.neck .mane b:nth-child(5){--shape-x:50%;  --shape-y:-26%; --shape-width:15%; --shape-height:58%; --shape-rotate:34deg;  --delay:-.36s; background-color:#6fc9ff}
.neck .mane b:nth-child(6){--shape-x:62%;  --shape-y:-20%; --shape-width:14%; --shape-height:48%; --shape-rotate:38deg;  --delay:-.45s; background-color:#b78cff}
.neck .mane b:nth-child(7){--shape-x:73%;  --shape-y:-13%; --shape-width:13%; --shape-height:38%; --shape-rotate:43deg;  --delay:-.54s; background-color:#e08cf0}
@keyframes mane-wave{
  0%,100%{transform:rotate(calc(var(--shape-rotate) - 5deg))}
  50%    {transform:rotate(calc(var(--shape-rotate) + 8deg))}
}
.animate .mane b{animation:mane-wave var(--speed) ease-in-out infinite}

/* ── rainbow tail — one hue per tail joint (bg + the box-shadow strands all
      read var(--color-hair), so setting it per depth recolors everything) ── */
.tail .nub{--color-hair:#ff77b8}
.tail .nub > .section{--color-hair:#ff8f5e}
.tail .nub > .section > .section{--color-hair:#ffd75e}
.tail .nub > .section > .section > .section{--color-hair:#7ee6a0}
.tail .nub > .section > .section > .section > .section{--color-hair:#6fc9ff}
.tail .nub > .section > .section > .section > .section > .section{--color-hair:#9b8cff}
.tail .nub > .section > .section > .section > .section > .section > .section{--color-hair:#c98cff}

/* ── golden stardust instead of dirt: small, crisp pastel twinkles ── */
.dust .particle{
  border:none;
  width:0.026rem; height:0.026rem;
  background-color:#ffca5f;
  box-shadow:0 0 0.014rem 0.004rem rgba(255,214,120,.85);
}
.dust .particle:nth-child(3n){background-color:#ff85bd; box-shadow:0 0 0.014rem 0.004rem rgba(255,133,189,.85)}
.dust .particle:nth-child(3n+1){background-color:#7fc4ff; box-shadow:0 0 0.014rem 0.004rem rgba(127,196,255,.85)}
/* a few of them are 4-point stars, not dots */
.dust .particle:nth-child(4n){
  border-radius:0;
  -webkit-clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
          clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
  box-shadow:none;
}

/* ═══════════ WINGS (the #wings toggle — pegasus variant) ═══════════
   Two feather-fan wings anchored at the withers: the FAR wing paints behind
   the body (lilac shade), the NEAR one above it (pearl). Each is a fan of
   four ellipse feathers spreading up-back from a common base; the whole wing
   flaps around that base and so rides the body bob automatically. */
.wing{display:none; border:none; pointer-events:none;
  --part-width:36%; --part-height:46%;
  --part-x:42%; --part-y:3%;
  --part-origin:12% 88%;
  --part-rotate:-6deg;
}
#wings:checked ~ label .wing{display:block}
.wing i{border:none; --shape-x:0%; --shape-y:46%; --shape-origin:6% 78%;}
.wing i:nth-child(1){--shape-width:96%; --shape-height:30%; --shape-rotate:-12deg;
  --shape-radius:20% 100% 65% 35% / 60% 90% 30% 40%;
  background-image:linear-gradient(100deg,#fffdff 45%,#f3ddff 80%,#ffd2ea)}
.wing i:nth-child(2){--shape-width:86%; --shape-height:28%; --shape-rotate:-34deg;
  --shape-radius:20% 100% 65% 35% / 60% 90% 30% 40%;
  background-image:linear-gradient(100deg,#fffaff 45%,#eed6fd 80%,#ffc9e6)}
.wing i:nth-child(3){--shape-width:72%; --shape-height:26%; --shape-rotate:-56deg;
  --shape-radius:20% 100% 65% 35% / 60% 90% 30% 40%;
  background-image:linear-gradient(100deg,#fdf6ff 45%,#e7cdfb 80%,#ffc0e2)}
.wing i:nth-child(4){--shape-width:56%; --shape-height:24%; --shape-rotate:-78deg;
  --shape-radius:20% 100% 65% 35% / 60% 90% 30% 40%;
  background-image:linear-gradient(100deg,#faf0ff 45%,#dfc4f8 80%,#ffb8de)}
/* far wing — a shaded twin, peeking out behind the back */
.wing.far{--part-x:47%; --part-y:6%; --part-rotate:4deg; --delay:calc(var(--speed) * -0.08);}
.wing.far i:nth-child(1){background-image:linear-gradient(100deg,#e9d8f6 45%,#d7bef0 80%,#efb6da)}
.wing.far i:nth-child(2){background-image:linear-gradient(100deg,#e4d1f4 45%,#d0b5ee 80%,#eaaad3)}
.wing.far i:nth-child(3){background-image:linear-gradient(100deg,#dfc9f2 45%,#c9abeb 80%,#e5a0cd)}
.wing.far i:nth-child(4){background-image:linear-gradient(100deg,#d9c0ef 45%,#c2a1e8 80%,#df96c7)}
/* the flap — a full sweep each stride, hinged at the wing base */
@keyframes wing-flap{
  0%,100%{transform:rotate(calc(var(--part-rotate) + 14deg))}
  50%    {transform:rotate(calc(var(--part-rotate) - 30deg))}
}
.animate .wing{animation:wing-flap var(--speed) ease-in-out infinite}
/* the feathers trail the flap slightly — a soft secondary motion */
@keyframes feather-trail{
  0%,100%{transform:rotate(calc(var(--shape-rotate) + 4deg))}
  50%    {transform:rotate(calc(var(--shape-rotate) - 6deg))}
}
.animate .wing i{animation:feather-trail var(--speed) ease-in-out infinite}
.wing i:nth-child(2){--delay:calc(var(--speed) * -0.04)}
.wing i:nth-child(3){--delay:calc(var(--speed) * -0.08)}
.wing i:nth-child(4){--delay:calc(var(--speed) * -0.12)}

/* ═══════════ WALK gait (the #gait-walk toggle) ═══════════
   A calm 4-beat walk: each leg swings alone, a quarter-cycle apart
   (footfall order LH → LF → RH → RF), the body barely bobs, the neck/head
   nod gently at each front footfall, and the stardust rests. Every walk
   keyframe INCLUDES the joint's base --shape/--part rotation (the animation
   replaces the rig's base transform). */
#gait-walk:checked ~ label{--speed:2.1s}
#gait-walk:checked ~ label .dust{display:none}
/* 4-beat footfall phases — a FORWARD walk plants LH → LF → RH → RF. A leg
   with delay d plants at t ≡ d (mod cycle), so LF must get -0.75 (≡ +0.25)
   and RF -0.25 (≡ +0.75); swapping these two reads as walking BACKWARD. */
#gait-walk:checked ~ label .back-leg.left{--delay:0s}
#gait-walk:checked ~ label .front-leg.left{--delay:calc(var(--speed) * -0.75)}
#gait-walk:checked ~ label .back-leg.right{--delay:calc(var(--speed) * -0.5)}
#gait-walk:checked ~ label .front-leg.right{--delay:calc(var(--speed) * -0.25)}

@keyframes walk-body{
  0%,50%,100%{transform:rotate(1.5deg) translatex(1%) translatey(0%)}
  25%,75%    {transform:rotate(2.5deg) translatex(1%) translatey(-2.5%)}
}
@keyframes walk-neck{
  0%,50%,100%{transform:scaleX(.95) rotate(42deg) translatex(3%) translatey(-8%)}
  25%,75%    {transform:scaleX(.95) rotate(39deg) translatex(4%) translatey(-4%)}
}
@keyframes walk-head{
  0%,50%,100%{transform:rotate(-42deg) translatex(0%) translatey(15%)}
  25%,75%    {transform:rotate(-46deg) translatex(3%) translatey(20%)}
}
/* front leg: 0-55% stance (planted FORWARD, sweeps BACK under the body —
   for the front leg POSITIVE rotation swings the hoof toward the head),
   55-100% swing (fold high + toe up + reach forward to plant) */
@keyframes walk-front-shoulder{
  0%{transform:rotate(7deg)} 55%{transform:rotate(-8deg)}
  80%{transform:rotate(0deg)} 100%{transform:rotate(7deg)}
}
@keyframes walk-front-upper{
  0%{transform:rotate(14deg)} 55%{transform:rotate(-15deg)}
  78%{transform:rotate(-2deg)} 90%{transform:rotate(17deg)}
  100%{transform:rotate(14deg)}
}
@keyframes walk-front-knee{
  0%,48%{transform:rotate(-3deg)} 66%{transform:rotate(-58deg)}
  88%{transform:rotate(-8deg)} 100%{transform:rotate(-3deg)}
}
@keyframes walk-front-lower{
  0%,52%{transform:rotate(10deg)} 70%{transform:rotate(-16deg)}
  100%{transform:rotate(10deg)}
}
@keyframes walk-front-ankle{
  0%,50%{transform:rotate(18deg)} 62%{transform:rotate(-8deg)}
  86%{transform:rotate(6deg)} 100%{transform:rotate(18deg)}
}
/* the foot COUNTER-ROTATES through stance so the hoof stays FLAT on the
   ground while the joints above it swing. Targets were MEASURED off the
   gallop's true planted frames (Web-Animations park + cumulative computed
   transforms): front hoof plants at ~+55° absolute, hind at ~+30° —
   keyframe = target − Σparents(t) at each stance phase. */
@keyframes walk-front-foot{
  0%{transform:rotate(10deg)} 30%{transform:rotate(34deg)}
  55%{transform:rotate(54deg)} 70%{transform:rotate(12deg)}
  100%{transform:rotate(10deg)}
}
/* back leg — anchored around the gallop's planted frame (24.9%): the hip
   (.top) swings the whole leg fore/aft; during the swing the leg LIFTS
   (hip ty drops, hock folds deep, toe tucks) so the hoof clearly clears
   the ground instead of dragging */
@keyframes walk-back-top{
  0%{transform:rotate(52deg) translatex(4%) translatey(28%)}
  58%{transform:rotate(8deg) translatex(-8%) translatey(40%)}
  80%{transform:rotate(38deg) translatex(0%) translatey(20%)}
  100%{transform:rotate(52deg) translatex(4%) translatey(28%)}
}
@keyframes walk-back-thigh{
  0%{transform:rotate(-102deg)}
  58%{transform:rotate(-66deg) translatex(-12%)}
  80%{transform:rotate(-118deg) translatex(16%) translatey(-4%)}
  100%{transform:rotate(-102deg)}
}
/* the swing keyframes carry the gallop's gathered-frame TRANSLATIONS — the
   joints don't rotate around exact pivots, so pure rotations tear visible
   GAPS between the segments mid-fold */
@keyframes walk-back-lower{
  0%,58%{transform:rotate(45deg)}
  74%{transform:rotate(108deg) translatex(40%) translatey(10%)}
  90%{transform:rotate(58deg) translatex(6%)}
  100%{transform:rotate(45deg)}
}
/* same flat-hoof compensation for the hind foot — held at the MEASURED +30°
   absolute (the old −93° anchor came from the gallop's 24.9% frame, where the
   hind leg is actually GATHERED IN THE AIR — it planted the pastern, not the
   hoof; the hind really plants at ~0% of the gallop cycle) */
@keyframes walk-back-foot{
  0%{transform:rotate(35deg) translatey(-20%)}
  30%{transform:rotate(39deg) translatey(-20%)}
  58%{transform:rotate(43deg) translatey(-20%)}
  74%{transform:rotate(40deg) translatex(58%) translatey(-26%)}
  92%{transform:rotate(45deg) translatex(10%) translatey(-20%)}
  100%{transform:rotate(35deg) translatey(-20%)}
}
#gait-walk:checked ~ label .animate .body{animation-name:walk-body}
#gait-walk:checked ~ label .animate .neck{animation-name:walk-neck}
#gait-walk:checked ~ label .animate .head{animation-name:walk-head}
#gait-walk:checked ~ label .animate .front-leg .shoulder{animation-name:walk-front-shoulder}
#gait-walk:checked ~ label .animate .front-leg .upper{animation-name:walk-front-upper}
#gait-walk:checked ~ label .animate .front-leg .knee{animation-name:walk-front-knee}
#gait-walk:checked ~ label .animate .front-leg .lower{animation-name:walk-front-lower}
#gait-walk:checked ~ label .animate .front-leg .ankle{animation-name:walk-front-ankle}
#gait-walk:checked ~ label .animate .front-leg .foot{animation-name:walk-front-foot}
#gait-walk:checked ~ label .animate .back-leg .top{animation-name:walk-back-top}
#gait-walk:checked ~ label .animate .back-leg .thigh{animation-name:walk-back-thigh}
#gait-walk:checked ~ label .animate .back-leg .lower-leg{animation-name:walk-back-lower}
#gait-walk:checked ~ label .animate .back-leg .foot{animation-name:walk-back-foot}

/* ═══════════ the workshop control panel ═══════════ */
input[type=radio]{position:fixed;opacity:0;pointer-events:none}
.panel{
  position:fixed;top:14px;right:14px;z-index:60;
  display:flex;gap:8px;direction:rtl;
  font-family:system-ui,'Segoe UI',Arial,sans-serif;font-size:15px;
}
.panel label{
  cursor:pointer;padding:7px 15px;border-radius:999px;
  background:rgba(255,255,255,.45);color:#5b3f86;
  box-shadow:0 2px 8px rgba(90,50,140,.18);
  -webkit-user-select:none;user-select:none;
}
#gait-run:checked ~ .panel label[for=gait-run],
#gait-walk:checked ~ .panel label[for=gait-walk],
#gait-fly:checked ~ .panel label[for=gait-fly],
#wings:checked ~ .panel label[for=wings],
#toggle:checked ~ .panel label[for=toggle]{
  background:#fff;color:#8b3fb0;font-weight:700;
  box-shadow:0 2px 12px rgba(120,60,190,.4);
}

/* ═══════════ CLICK MAGIC (fx.js at the end of the body) ═══════════
   Click the unicorn → golden lightning bolts crack from the horn tip;
   every few clicks she also lets out a rainbow toot 💨 (pastel puffs +
   star sparks from under the tail + a startled little hop). */
.fx-layer{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.fx-bolt{
  position:absolute;width:22px;height:64px;transform-origin:50% 100%;
  background:linear-gradient(180deg,#fff6c8,#ffd23e 45%,#f0a512);
  -webkit-clip-path:polygon(52% 0,68% 0,44% 38%,60% 38%,28% 100%,40% 55%,24% 55%);
          clip-path:polygon(52% 0,68% 0,44% 38%,60% 38%,28% 100%,40% 55%,24% 55%);
  filter:drop-shadow(0 0 6px rgba(255,214,90,.95));
  animation:fx-bolt .38s ease-out forwards;
}
@keyframes fx-bolt{
  0%  {opacity:0;transform:rotate(var(--a,0deg)) scaleY(.25)}
  18% {opacity:1}
  100%{opacity:0;transform:rotate(var(--a,0deg)) translateY(-30px) scaleY(1.08)}
}
.fx-flash{
  position:absolute;width:92px;height:92px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,214,90,.55) 40%,transparent 70%);
  animation:fx-flash .45s ease-out forwards;
}
@keyframes fx-flash{
  0%  {opacity:0;transform:translate(-50%,-50%) scale(.3)}
  20% {opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.7)}
}
.fx-star{
  position:absolute;width:14px;height:14px;background:#ffd76e;
  -webkit-clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
          clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
  animation:fx-spark .8s ease-out forwards;
}
@keyframes fx-spark{
  0%  {opacity:1;transform:translate(0,0) scale(.5) rotate(0deg)}
  100%{opacity:0;transform:translate(var(--dx,0px),var(--dy,0px)) scale(1.2) rotate(160deg)}
}
.fx-puff{position:absolute;border-radius:50%;filter:blur(1.5px);animation:fx-puff 1.15s ease-out forwards}
@keyframes fx-puff{
  0%  {opacity:0;transform:translate(0,0) scale(.3)}
  12% {opacity:1}
  70% {opacity:.8}
  100%{opacity:0;transform:translate(var(--dx,40px),var(--dy,0px)) scale(1.8)}
}
.fx-wee{position:absolute;font-size:34px;animation:fx-wee 1s ease-out forwards}
@keyframes fx-wee{
  0%  {opacity:0;transform:translate(-30%,-50%) scale(.4)}
  20% {opacity:1}
  100%{opacity:0;transform:translate(10px,-14px) scale(1.15)}
}
/* rotating click extras: floating hearts / a rainbow arc / a star shower */
.fx-heart{position:absolute;font-size:22px;animation:fx-heart 1.2s ease-out forwards}
@keyframes fx-heart{
  0%  {opacity:0;transform:translate(0,0) scale(.4)}
  15% {opacity:1}
  100%{opacity:0;transform:translate(var(--dx,0px),-95px) scale(1.25)}
}
.fx-rainbow{
  position:absolute;width:190px;height:96px;transform-origin:50% 100%;
  background:radial-gradient(circle at 50% 100%,
    transparent 52px, #ff5f8f 53px 60px, #ffa564 61px 68px, #ffe066 69px 76px,
    #7ee6a0 77px 84px, #6fc9ff 85px 92px, transparent 93px);
  animation:fx-rainbow 1.3s ease-out forwards;
}
@keyframes fx-rainbow{
  0%  {opacity:0;transform:scale(.45)}
  25% {opacity:.95}
  70% {opacity:.85}
  100%{opacity:0;transform:scale(1.12)}
}
/* the startled hop that goes with the toot */
@keyframes uni-hop{0%,100%{transform:translateY(0)}35%{transform:translateY(-6%)}65%{transform:translateY(1.5%)}}
.🐴.hop{animation:uni-hop .5s ease-out}

/* ═══════════ PROUD POSTURE — no more bowing in the gallop ═══════════
   The rig's original gallop dives the HEAD down (translatey up to +45%),
   squashes the NECK (scaleX .85, ty +5%) and pitches/squashes the BODY
   (rotate up to 10°, scaleX .9) — together a deep bow every cycle. These
   calm replacements keep a light bob but cancel the bend; the legs are
   SIBLINGS of the body, so nothing else is affected. Walk/fly keep their
   own overrides (id-selector rules win). */
@keyframes run-body{
  0%,100%{transform:rotate(4deg) translatex(1%) translatey(-4%)}
  20%    {transform:rotate(2deg) translatex(1%) translatey(0%)}
  45%    {transform:rotate(2.5deg) translatex(2%) translatey(-3%)}
  70%    {transform:rotate(3deg) translatex(1%) translatey(-2%)}
  90%    {transform:rotate(5.5deg) translatex(0%) translatey(-8%)}
}
@keyframes run-neck{
  0%,100%{transform:scaleX(.97) rotate(41deg) translatex(2%) translatey(-10%)}
  50%    {transform:scaleX(.97) rotate(43.5deg) translatex(4%) translatey(-6%)}
}
@keyframes run-head{
  0%,100%{transform:rotate(-43deg) translatex(-2%) translatey(12%)}
  50%    {transform:rotate(-40deg) translatex(4%) translatey(17%)}
}
.animate .body{animation-name:run-body}
.animate .neck{animation-name:run-neck}
.animate .head{animation-name:run-head}

/* ═══════════ IDLE LIFE — mane shake (fx.js adds .shake every 6-13s) ═══════
   The locks + forelock whip quickly and the ear flicks; the gait animations
   keep running untouched (only mane/forelock/ear swap their animation). */
@keyframes mane-whip{
  from{transform:rotate(calc(var(--shape-rotate) - 10deg))}
  to  {transform:rotate(calc(var(--shape-rotate) + 16deg))}
}
.🐴.shake .mane b,
.🐴.shake .forelock{animation:mane-whip .16s ease-in-out 5 alternate}
@keyframes ear-flick{
  from{transform:rotate(-6deg)}
  to  {transform:rotate(28deg)}
}
.🐴.shake .head .ear{animation:ear-flick .15s ease-in-out 5 alternate}

/* ═══════════ FLIGHT (the #gait-fly toggle) ═══════════
   She lifts off and hovers: wings forced ON with big graceful wingbeats,
   legs tucked under and dangling gently, everything else slowed dreamy
   (--speed 3s drives the tail/mane sway), stardust off. */
#gait-fly:checked ~ label{--speed:3s}
#gait-fly:checked ~ label .dust{display:none}
#gait-fly:checked ~ label .wing{display:block}
@keyframes uni-float{0%,100%{transform:translateY(-14%)}50%{transform:translateY(-23%)}}
#gait-fly:checked ~ label .🐴{animation:uni-float 3s ease-in-out infinite}
@keyframes fly-body{
  0%,100%{transform:rotate(-2deg) translatey(0%)}
  50%    {transform:rotate(-4deg) translatey(-2%)}
}
#gait-fly:checked ~ label .animate .body{animation-name:fly-body}
#gait-fly:checked ~ label .animate .neck{animation-name:walk-neck}
#gait-fly:checked ~ label .animate .head{animation-name:walk-head}
/* legs STREAM BACKWARD with the airflow (she's rushing forward) — the rig's
   base pose is exactly a connected back-stretch, so the joints sit near
   their base rotations (animation:none = authored-connected) while the
   upper/thigh ripple gently in the wind. Front legs: negative = backward. */
#gait-fly:checked ~ label .animate .front-leg .shoulder{animation:none;--shape-rotate:-16deg}
@keyframes fly-front-upper{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-47deg)}}
#gait-fly:checked ~ label .animate .front-leg .upper{animation:fly-front-upper 3s ease-in-out infinite}
#gait-fly:checked ~ label .animate .front-leg .knee{animation:none;--shape-rotate:-30deg}
#gait-fly:checked ~ label .animate .front-leg .lower{animation:none;--shape-rotate:18deg}
#gait-fly:checked ~ label .animate .front-leg .ankle{animation:none;--shape-rotate:26deg}
#gait-fly:checked ~ label .animate .front-leg .foot{animation:none}
#gait-fly:checked ~ label .animate .back-leg .top{animation:none;--shape-rotate:22deg}
@keyframes fly-back-thigh{0%,100%{transform:rotate(-90deg)}50%{transform:rotate(-97deg)}}
#gait-fly:checked ~ label .animate .back-leg .thigh{animation:fly-back-thigh 3s ease-in-out infinite}
#gait-fly:checked ~ label .animate .back-leg .lower-leg{animation:none;--shape-rotate:42deg}
#gait-fly:checked ~ label .animate .back-leg .foot{animation:none}
/* big graceful wingbeats (own tempo, independent of --speed) */
@keyframes wing-fly{
  0%,100%{transform:rotate(calc(var(--part-rotate) + 22deg))}
  50%    {transform:rotate(calc(var(--part-rotate) - 55deg))}
}
#gait-fly:checked ~ label .animate .wing{animation:wing-fly 1.05s ease-in-out infinite}
#gait-fly:checked ~ label .animate .wing i{animation-duration:1.05s}
/* soaring: NO cutie mark on flyers (user request) */
#gait-fly:checked ~ label .cutie{display:none}
/* WIND: the mane, tail and horn-glow flutter fast while airborne (the slow
   dreamy --speed:3s stays for the body/neck bob) */
#gait-fly:checked ~ label .animate .mane b{animation-duration:1.15s}
#gait-fly:checked ~ label .animate .tail,
#gait-fly:checked ~ label .animate .tail .section,
#gait-fly:checked ~ label .animate .tail .section > * > *,
#gait-fly:checked ~ label .animate .tail .section > * > * > * > *{animation-duration:1.3s}
#gait-fly:checked ~ label .animate .horn{animation-duration:1.6s}
/* FLIGHT SKY FX — soft cloud puffs stream past her (the world rushing by)
   and a golden star trail streams off behind her. Painted right after the
   floor, so everything stays BEHIND the unicorn. */
.fly-fx{display:none;position:fixed;inset:0;pointer-events:none;overflow:hidden}
#gait-fly:checked ~ label .fly-fx{display:block}
.fly-fx i{
  position:absolute;background:rgba(255,255,255,.8);
  border-radius:999px;filter:blur(1.5px);
  animation:fly-cloud linear infinite;
}
@keyframes fly-cloud{from{transform:translateX(-20vw)}to{transform:translateX(115vw)}}
.fly-fx i:nth-child(1){top:24%;left:0;width:110px;height:22px;animation-duration:7s;animation-delay:-2s}
.fly-fx i:nth-child(2){top:38%;left:0;width:70px;height:15px;animation-duration:5.2s;animation-delay:-4.4s;opacity:.6}
.fly-fx i:nth-child(3){top:52%;left:0;width:130px;height:26px;animation-duration:8.5s;animation-delay:-6.5s}
.fly-fx i:nth-child(4){top:64%;left:0;width:85px;height:17px;animation-duration:6s;animation-delay:-1.2s;opacity:.55}
.fly-fx b{
  position:absolute;left:57%;width:13px;height:13px;background:#ffd76e;
  -webkit-clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
          clip-path:polygon(50% 0%,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0% 50%,38% 38%);
  animation:fly-trail ease-out infinite;
}
@keyframes fly-trail{
  0%  {opacity:0;transform:translate(0,0) scale(.5) rotate(0deg)}
  12% {opacity:1}
  100%{opacity:0;transform:translate(36vw,var(--dy,0px)) scale(1.05) rotate(150deg)}
}
.fly-fx b:nth-child(5) {top:30%;left:60%;--dy:-24px;animation-duration:2.3s;animation-delay:-.3s}
.fly-fx b:nth-child(6) {top:34%;left:61%;--dy:16px;animation-duration:2.7s;animation-delay:-1.1s;background:#ff9ecb}
.fly-fx b:nth-child(7) {top:38%;left:60%;--dy:-10px;animation-duration:2.1s;animation-delay:-1.7s;background:#9ad4ff}
.fly-fx b:nth-child(8) {top:32%;left:62%;--dy:28px;animation-duration:3s;animation-delay:-2.2s;background:#a4f0b7}
.fly-fx b:nth-child(9) {top:40%;left:61%;--dy:-30px;animation-duration:2.5s;animation-delay:-.8s;background:#e0a8ff}
.fly-fx b:nth-child(10){top:36%;left:60%;--dy:8px;animation-duration:2.9s;animation-delay:-1.9s}

/* ═══════════ COAT COLORS — five unicorn types ═══════════
   Each coat re-tints the body (+ far legs + forelock accent) and stamps its
   own CUTIE MARK — a little glowing emoji on the rump. The rainbow mane/tail
   and the golden horn suit every coat. */
/* the cutie mark — now a DIRECT part of the horse, painted LAST (markup: the
   final 🐴 child), so no limb/neck/mane can ever sweep over it in any gait
   (user request: the mark must ALWAYS be visible). Same visual spot as the old
   in-body position: 53%/36.6% = body(20,30,55,33) + in-body (60%,20%). */
.cutie{
  --part-x:53%; --part-y:36.6%; --part-width:12.1%; --part-height:15.84%;
  background-color:transparent; border:none;
  display:flex; align-items:center; justify-content:center;
}
.cutie::before{
  content:'⭐';
  position:static; width:auto; height:auto; background:transparent; border:none;
  font-size:.2rem; line-height:1;
  filter:drop-shadow(0 0 .018rem rgba(255,255,255,.85));
  animation:cutie-glow 2.6s ease-in-out infinite;
}
@keyframes cutie-glow{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

/* pink — strawberry unicorn, heart mark */
#color-pink:checked ~ label{--color-horse:#ffdff0;--color-horse-back:#efb0d6}
#color-pink:checked ~ label .head .forelock{background-color:#ff6db4}
#color-pink:checked ~ label .cutie::before{content:'💗'}
/* sky — cloud unicorn, snowflake mark */
#color-sky:checked ~ label{--color-horse:#dcedff;--color-horse-back:#aecdf2}
#color-sky:checked ~ label .head .forelock{background-color:#6fb6ff}
#color-sky:checked ~ label .cutie::before{content:'🦋'}
/* mint — meadow unicorn, clover mark */
#color-mint:checked ~ label{--color-horse:#dff8ea;--color-horse-back:#b0e3ca}
#color-mint:checked ~ label .head .forelock{background-color:#4fd096}
#color-mint:checked ~ label .cutie::before{content:'🍀'}
/* night — midnight unicorn (white eye for contrast), moon mark */
#color-night:checked ~ label{--color-horse:#5a4a88;--color-horse-back:#42356a}
#color-night:checked ~ label .head .forelock{background-color:#ff8fc8}
/* the white-sclera eye reads natively on the dark coat — only the lashes and
   the blush need night tints */
#color-night:checked ~ label .head .lash,
#color-night:checked ~ label .head .lash::before,
#color-night:checked ~ label .head .lash::after{background-color:#eee3ff}
#color-night:checked ~ label .head .blush{
  background:radial-gradient(circle, rgba(255,150,200,.6), rgba(255,150,200,0) 72%);
}
#color-night:checked ~ label .cutie::before{content:'🌙'}

/* the color swatches in the panel — little coat-colored circles */
.panel .swatches{display:flex;gap:6px;align-items:center;padding:3px 6px;
  background:rgba(255,255,255,.3);border-radius:999px}
.panel label.swatch{width:24px;height:24px;padding:0;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 5px rgba(90,50,140,.25)}
.panel .sw-pearl{background:#fff6fb}
.panel .sw-pink{background:#ffc3e3}
.panel .sw-sky{background:#bcdcff}
.panel .sw-mint{background:#bff0d8}
.panel .sw-night{background:#5a4a88}
#color-pearl:checked ~ .panel label[for=color-pearl],
#color-pink:checked ~ .panel label[for=color-pink],
#color-sky:checked ~ .panel label[for=color-sky],
#color-mint:checked ~ .panel label[for=color-mint],
#color-night:checked ~ .panel label[for=color-night]{
  box-shadow:0 0 0 3px #8b3fb0; font-weight:400;
}

</style>

</div>
<label id="scene">

		<i></i><i></i><i></i><i></i>

	<div class="🐴 animate">
		<div class="front-leg right">
			<div class="shoulder">
				<div class="upper">
					<div class="knee">
						<div class="lower">
							<div class="ankle">

<script>
/* ── CLICK MAGIC — the only JS in the file (the rig itself is pure CSS).
      Click the unicorn: golden lightning cracks from the horn tip; every few
      clicks (3-5, first at 4) she also lets out a rainbow toot 💨 with pastel
      puffs + star sparks from under the tail and a startled little hop. ── */
(function () {
  'use strict';
  var scene = document.getElementById('scene');
  var fx = document.createElement('div');
  fx.className = 'fx-layer';
  document.body.appendChild(fx);

  var R = function (a, b) { return a + Math.random() * (b - a); };
  function spawn(cls, x, y) {
    var d = document.createElement('div');
    d.className = cls;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    fx.appendChild(d);
    setTimeout(function () { d.remove(); }, 1300);
    return d;
  }
  function hornTip() {  /* the horn rides the head animation — sample it live */
    var h = document.querySelector('.horn').getBoundingClientRect();
    return { x: h.left + h.width / 2, y: h.top + 3 };
  }
  function rearPt() {  /* behind the hindquarters — the body box's rear edge */
    var b = document.querySelector('.body').getBoundingClientRect();
    return { x: b.right + 4, y: b.top + b.height * 0.62 };
  }

  function lightning() {
    var p = hornTip();
    spawn('fx-flash', p.x, p.y);
    var n = 4 + Math.floor(Math.random() * 3);
    for (var i = 0; i < n; i++) (function (i) {
      setTimeout(function () {
        var b = spawn('fx-bolt', p.x - 11, p.y - 64);   /* bolt base at the tip */
        b.style.setProperty('--a', R(-75, 75) + 'deg');
      }, i * 45);
    })(i);
    for (var s = 0; s < 6; s++) {                        /* upward star spray */
      var ang = R(-Math.PI, 0), d = R(28, 70);
      var st = spawn('fx-star', p.x - 7, p.y - 7);
      st.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      st.style.setProperty('--dy', Math.sin(ang) * d + 'px');
      st.style.background = ['#ffd76e', '#ff9ecb', '#9ad4ff'][s % 3];
    }
  }

  var uni = document.querySelector('.🐴');

  /* idle life: every 6-13s she shakes her mane (locks whip, ear flicks) */
  (function schedShake() {
    setTimeout(function () {
      uni.classList.add('shake');
      setTimeout(function () { uni.classList.remove('shake'); }, 900);
      schedShake();
    }, 6000 + Math.random() * 7000);
  })();

  var PUFFS = ['#c9f7d4', '#ffd9ec', '#e6d6ff', '#fff3c4', '#cfe8ff'];
  function toot() {
    var p = rearPt();
    uni.classList.remove('hop'); void uni.offsetWidth; uni.classList.add('hop');
    spawn('fx-wee', p.x, p.y).textContent = '💨';
    for (var i = 0; i < 6; i++) (function (i) {
      setTimeout(function () {
        var pf = spawn('fx-puff', p.x - 10, p.y - 10);
        var s = R(22, 44);
        pf.style.width = s + 'px'; pf.style.height = s + 'px';
        pf.style.background = 'radial-gradient(circle at 35% 35%, #fff, ' + PUFFS[i % PUFFS.length] + ')';
        pf.style.setProperty('--dx', R(34, 115) + 'px');  /* drifts backward (right) */
        pf.style.setProperty('--dy', R(-6, 30) + 'px');
      }, i * 60);
    })(i);
    for (var s2 = 0; s2 < 7; s2++) {                     /* glitter with it */
      var ang = R(-0.9, 0.9), d = R(30, 85);
      var st = spawn('fx-star', p.x - 7, p.y - 7);
      st.style.setProperty('--dx', Math.cos(ang) * d + 'px');
      st.style.setProperty('--dy', Math.sin(ang) * d * 0.5 + 'px');
      st.style.background = ['#ffd76e', '#ff9ecb', '#9ad4ff', '#a4f0b7'][s2 % 4];
    }
  }

  /* every click also TRANSFORMS her — the next coat color, switched a beat
     after the lightning so the flash covers the change */
  var COATS = ['color-pearl', 'color-pink', 'color-sky', 'color-mint', 'color-night'];
  function nextCoat() {
    for (var i = 0; i < COATS.length; i++)
      if (document.getElementById(COATS[i]).checked) {
        document.getElementById(COATS[(i + 1) % COATS.length]).checked = true;
        return;
      }
  }

  /* rotating bonus effects — a different one accompanies each click */
  function heartsFx() {
    var r = uni.getBoundingClientRect();
    for (var i = 0; i < 5; i++) (function (i) {
      setTimeout(function () {
        var h = spawn('fx-heart',
          r.left + r.width * (0.2 + Math.random() * 0.55), r.top + r.height * 0.3);
        h.textContent = ['💗', '💖', '💕'][i % 3];
        h.style.setProperty('--dx', R(-32, 32) + 'px');
      }, i * 90);
    })(i);
  }
  function rainbowFx() {
    var r = uni.getBoundingClientRect();
    spawn('fx-rainbow', r.left + r.width / 2 - 95, r.top - 55);
  }
  function showerFx() {
    var r = uni.getBoundingClientRect();
    for (var i = 0; i < 10; i++) (function (i) {
      setTimeout(function () {
        var st = spawn('fx-star',
          r.left + r.width * (0.08 + Math.random() * 0.85), r.top - R(10, 40));
        st.style.setProperty('--dx', R(-14, 14) + 'px');
        st.style.setProperty('--dy', R(55, 115) + 'px');
        st.style.background = ['#ffd76e', '#ff9ecb', '#9ad4ff', '#a4f0b7'][i % 4];
      }, i * 55);
    })(i);
  }
  var EXTRAS = [heartsFx, rainbowFx, showerFx];

  var clicks = 0, nextToot = 4, extraIdx = 0;            /* first toot on the 4th click */
  scene.addEventListener('pointerdown', function () {
    clicks++;
    lightning();
    setTimeout(nextCoat, 130);                           /* transform under the flash */
    EXTRAS[extraIdx++ % EXTRAS.length]();
    if (clicks >= nextToot) {
      clicks = 0;
      nextToot = 3 + Math.floor(Math.random() * 3);      /* then every 3-5 clicks */
      setTimeout(toot, 180);
    }
  });
})();
</script>

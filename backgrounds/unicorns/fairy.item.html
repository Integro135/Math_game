<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧚 Fairy — standalone item</title>
<style>
  html,body{margin:0;height:100%;background:#0a0d14;color:#cdd6e6;
    font-family:system-ui,'Segoe UI',sans-serif}
  .head{padding:14px 18px 0;text-align:center}
  .head h1{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:.02em}
  .head p{margin:6px 0 0;font-size:.82rem;opacity:.7}
  .controls{display:flex;gap:16px;justify-content:center;align-items:center;
    flex-wrap:wrap;padding:12px;font-size:.85rem}
  .controls label{display:flex;gap:6px;align-items:center}
  .controls button{background:#1b2233;color:#cdd6e6;border:1px solid #2c3550;
    border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:600}
  .controls button:hover{background:#232c42}
  /* the fairy carries NO background of its own — this neutral dark stage is only
     here so the white/pink glow is visible while inspecting the standalone item */
  .stage{position:relative;height:min(70vh,560px);margin:10px auto 24px;
    max-width:900px;border-radius:16px;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 30%,#16203a 0%,#0b1020 70%,#070a12 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
  /* three sample placements to show scaling + a pinned (no-wander) one */
</style>
</head>
<body>
  <div class="head">
    <h1>🧚 Fairy — standalone item</h1>
    <p>extracted from <code>fairy.html</code> — just the fairy (heart + wings + sparks), no frame/stars.
       drop into a scene with <code>Fairy.place(parent,&nbsp;opts)</code>.</p>
  </div>

  <div class="controls">
    <label>גֹּדֶל <input id="scale" type="range" min="0.4" max="2" step="0.1" value="1"></label>
    <button id="wander">כִּבּוּי נְדוּדִים</button>
    <span id="scale-val" style="opacity:.6">×1.0</span>
  </div>

  <div class="stage" id="stage"></div>

  <script src="fairy.item.js"></script>
  <script>
    var stage = document.getElementById('stage');
    // main fairy — centred, wandering (its natural "flying" drift)
    var main = Fairy.place(stage, { left: '50%', top: '50%', scale: 1 });
    // a couple of smaller pinned ones, to show scaling + fixed placement
    Fairy.place(stage, { left: '20%', top: '68%', scale: 0.55, wander: false });
    Fairy.place(stage, { left: '82%', top: '30%', scale: 0.7,  wander: false });

    var wander = true;
    document.getElementById('scale').addEventListener('input', function (e) {
      var s = parseFloat(e.target.value);
      main.setScale(s);
      document.getElementById('scale-val').textContent = '×' + s.toFixed(1);
    });
    document.getElementById('wander').addEventListener('click', function () {
      wander = !wander;
      main.setWander(wander);
      this.textContent = wander ? 'כִּבּוּי נְדוּדִים' : 'הַפְעָלַת נְדוּדִים';
    });
  </script>
</body>
</html>

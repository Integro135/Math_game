<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Background — Dev Harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     Thin development harness for the SPACE background module.
     The actual scene lives in space.bg.js — the SAME file the game loads
     dynamically (single source of truth, no more copy-porting).
     Open this file directly to iterate on the background in isolation.
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #04030d; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: fixed; inset: 0; }
  #toggle {
    position: fixed; bottom: 24px; right: 24px; z-index: 10;
    padding: 9px 22px;
    background: rgba(18, 14, 48, 0.45);
    color: rgba(190, 205, 255, 0.92);
    border: 1px solid rgba(140, 160, 255, 0.35);
    border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(4, 2, 16, 0.45);
    transition: background .25s, box-shadow .25s, transform .15s;
  }
  #toggle:hover {
    background: rgba(50, 40, 110, 0.6);
    box-shadow: 0 4px 24px rgba(130, 150, 255, 0.25);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
<div id="stage"></div>
<button id="toggle">Restart</button>
<script src="space.bg.js"></script>
<script>
let cleanup = null;
function start() {
  if (cleanup) cleanup();
  cleanup = window.BACKGROUNDS.space.init({ stage: document.getElementById('stage') });
}
document.getElementById('toggle').addEventListener('click', start);
start();
</script>
</body>
</html>

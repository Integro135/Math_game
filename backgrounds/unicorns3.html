<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unicorn Valley v3 — Dev Harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     Thin development harness for the UNICORNS v3 background module: the v2
     canvas valley + day cycle carrying the ORIGINAL CSS unicorns and castle
     as DOM layers. The scene lives in unicorns3.bg.js — the SAME file the
     game loads. Buttons jump the clock to each part of the day (a smooth
     2.6 s tween), Pause freezes the clock, Fast runs the day 20× faster,
     Magic fires the scenery effects + every on-stage unicorn's click magic,
     Restart re-inits. The clock line also shows the canvas pacing state
     (full / ½ rate) and backing-store scale from window._uni3.perf().
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #2a1440; overflow: hidden; width: 100vw; height: 100vh; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; bottom: 24px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; z-index: 10; flex-wrap: wrap; }
  .hbtn {
    padding: 8px 18px;
    background: rgba(255, 255, 255, 0.5);
    color: #8E2BC8;
    border: 1px solid rgba(216, 112, 184, 0.5);
    border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(120, 40, 90, 0.25);
    transition: background .25s, transform .15s;
  }
  .hbtn:hover { background: rgba(255, 255, 255, 0.8); transform: translateY(-1px); }
  .hbtn.on { background: rgba(255, 143, 200, 0.75); color: #fff; }
  #clock { position: fixed; top: 16px; left: 18px; color: rgba(90, 42, 82, .9); font: 13px Georgia, serif; letter-spacing: .1em; z-index: 10;
           background: rgba(255,255,255,.45); padding: 4px 10px; border-radius: 999px; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="clock"></div>
<div id="bar">
  <button class="hbtn" data-tod="0.125">Dawn</button>
  <button class="hbtn" data-tod="0.375">Day</button>
  <button class="hbtn" data-tod="0.625">Sunset</button>
  <button class="hbtn" data-tod="0.875">Night</button>
  <button class="hbtn" id="pause">Pause</button>
  <button class="hbtn" id="fast">Fast</button>
  <button class="hbtn" id="magic">Magic</button>
  <button class="hbtn" id="restart">Restart</button>
</div>
<script src="unicorns3.bg.js"></script>
<script>
let cleanup = null, paused = false, fast = false;
function start(){
  if (cleanup) cleanup();
  cleanup = window.BACKGROUNDS.unicorns3.init({ stage: document.getElementById('stage') });
  paused = false; fast = false;
  document.getElementById('pause').classList.remove('on'); document.getElementById('fast').classList.remove('on');
}
document.querySelectorAll('[data-tod]').forEach(b => b.onclick = () => window._uni3 && window._uni3.setTod(+b.dataset.tod));
document.getElementById('pause').onclick = e => { paused = !paused; e.target.classList.toggle('on', paused); window._uni3.setSpeed(paused ? 0 : (fast ? 20 : 1)); };
document.getElementById('fast').onclick = e => { fast = !fast; e.target.classList.toggle('on', fast); window._uni3.setSpeed(paused ? 0 : (fast ? 20 : 1)); };
document.getElementById('magic').onclick = () => { const f = window._uni3.fx; f.rainbow(); f.rainbowFall(); f.castle(); f.fish(); f.glitter(2); window._uni3.magic(); };
document.getElementById('restart').onclick = start;
setInterval(() => { if (window._uni3){ const t = window._uni3.tod(); const A = [5.5, 10.5, 14.5, 19.5, 29.5], k = Math.min(3, Math.floor(t * 4)); const h = (A[k] + (t * 4 - k) * (A[k + 1] - A[k])) % 24; const p = window._uni3.perf ? window._uni3.perf() : null; document.getElementById('clock').textContent = window._uni3.phase().toUpperCase() + ' · ' + String(Math.floor(h)).padStart(2, '0') + ':' + String(Math.floor((h % 1) * 60)).padStart(2, '0') + ' · ' + window._uni3.onStage() + ' unicorn(s) on stage' + (p ? ' · ' + (p.halfRate ? '½ rate' : 'full rate') + ' · ' + p.dpr + '×' : ''); } }, 250);
start();
</script>
</body>
</html>

<title>Ice Princess — Character Dev</title>
<!-- ───────────────────────────────────────────────────────────────────────
     STANDALONE character workshop for the ROYAL SISTERS:
       · ICE PRINCESS (Elsa-style) — blue ice dress, blonde side braid,
         sheer snowflake cape, ice magic in the raised palm.
       · her SISTER (Anna-style) — brown twin braids, freckles, warm
         rose dress with laced bodice + hem flowers, waving hello.
     Same workflow as olaf.html → frozen.bg.js: iterate here in isolation,
     port into the frozen background only when they look good.

     PRINCESS_SVG / SISTER_SVG + PR_CSS below are written exactly like the
     penguin/seal sprites in frozen.bg.js (string array, .eye blink class,
     wrapper + act + shadow layers) so porting is copy-paste. NOTE: the
     defs ids (pr*G / pr*2G) must get a per-instance suffix when ported
     (dinosaurs2 lesson).

     Interactions here: click the princess (or Magic) → rise + ICE JET
     (palm flare + a cone of snowflakes/crystals with end-of-arc gravity);
     click the sister (or Wave) → double hop + 💗🌸✨ burst from the
     waving hand. BG cycles night / day / plain.
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: linear-gradient(180deg, #0a1734 0%, #1d3f6e 55%, #2c5a94 100%); transition: background .4s; }
  body.bg-day   { background: linear-gradient(180deg, #bfe3f7 0%, #e8f7ff 70%, #f6fcff 100%); }
  body.bg-plain { background: #2a2d36; }
  #stage { position: fixed; inset: 0; }
  /* frozen-lake floor band */
  #stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 15%;
    background: linear-gradient(180deg, rgba(190,230,255,.08), rgba(215,242,255,.30));
    border-top: 1px solid rgba(235,250,255,.30);
  }
  body.bg-day #stage::after { background: linear-gradient(180deg, rgba(255,255,255,.25), rgba(255,255,255,.6)); }
  /* soft moon glow up-left (night only) */
  #stage::before {
    content: ""; position: absolute; left: 6%; top: 4%; width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(214,240,255,.22), rgba(214,240,255,0) 70%);
  }
  body.bg-day #stage::before, body.bg-plain #stage::before { display: none; }
  .hbtn {
    position: fixed; bottom: 24px; z-index: 10;
    padding: 9px 22px;
    background: rgba(14, 30, 62, 0.55);
    color: rgba(214, 238, 255, 0.92);
    border: 1px solid rgba(140, 200, 255, 0.35);
    border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(4, 10, 24, 0.45);
    transition: background .25s, box-shadow .25s, transform .15s;
  }
  .hbtn:hover {
    background: rgba(35, 70, 130, 0.6);
    box-shadow: 0 4px 24px rgba(120, 190, 255, 0.25);
    transform: translateY(-1px);
  }
  #magic { right: 24px; }
  #wave { right: 140px; }
  #bg { right: 252px; }
</style>
</head>

function parseSVG(markup) {
  markup = markup.replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" ');
  return new DOMParser().parseFromString(markup, 'image/svg+xml').documentElement;
}
var style = doc.createElement('style');
style.textContent = PR_CSS;
doc.head.appendChild(style);

var stage = doc.getElementById('stage');
function buildFigure(markup, leftPct, heightPct, breathDelay) {
  var wrap = doc.createElement('div');
  wrap.className = 'prw';
  wrap.style.cssText = 'height:' + heightPct + '%;left:' + leftPct + '%;bottom:8%;transform:translateX(-50%)';
  var act = doc.createElement('div');
  act.className = 'pract';
  if (breathDelay) act.style.animationDelay = breathDelay;
  act.appendChild(parseSVG(markup));
  var sh = doc.createElement('div');
  sh.className = 'pr-shadow';
  wrap.appendChild(sh);
  wrap.appendChild(act);
  stage.appendChild(wrap);
  return { wrap: wrap, act: act, busy: false };
}

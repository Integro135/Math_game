<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bulbasaur workshop — background character</title>
<!-- ───────────────────────────────────────────────────────────────────────
     DEV STAGE for the Bulbasaur background character (mirrors pokedex.html).
     window.Pokemons.bulbasaur = { nativeW/H, footFrac, place(opts)→inst }.
     One Bulbasaur WALKS the blank stage side to side (inst.patrol).
     Buttons exercise the object API. Verify hooks: window.__pk = {list, probe}.
     Source pen reference: balbasaur.html (kept untouched).
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #f2f4f6; }
  #stage { position: fixed; inset: 0; }
  #stage::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 12%;
    background: linear-gradient(180deg, rgba(0,0,0,0), rgba(70,80,90,.08));
    pointer-events: none;
  }
  .hbtn {
    position: fixed; bottom: 24px; z-index: 10; padding: 9px 22px;
    background: rgba(40,50,60,.75); color: rgba(240,245,250,.95);
    border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
    font-family: Georgia, serif; font-size: 13px; letter-spacing: .12em;
    text-transform: uppercase; cursor: pointer;
  }
  .hbtn:hover { background: rgba(60,75,90,.85); }
  #walk { right: 24px; } #pause { right: 150px; } #green { right: 250px; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="green" class="hbtn">Green</button>
<button id="pause" class="hbtn">Pause</button>
<button id="walk" class="hbtn">Stop walk</button>

<script src="bulbasaur.js"></script>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('stage');

  var b = Pokemons.bulbasaur.place({ parent: stage, height: '34%', left: '8%', bottom: '10%' });
  var walking = b.patrol({ speed: 150 });

  var paused = false;
  document.getElementById('pause').addEventListener('click', function () {
    paused = !paused; b.setPaused(paused); this.textContent = paused ? 'Play' : 'Pause';
  });
  document.getElementById('walk').addEventListener('click', function () {
    if (walking) { walking.stop(); walking = null; this.textContent = 'Walk'; }
    else { walking = b.patrol({ speed: 150 }); this.textContent = 'Stop walk'; }
  });
  document.getElementById('green').addEventListener('click', function () {
    // demo only: the module bakes the pen's shiny-cyan palette; this recolours the
    // live nodes to the classic green Bulbasaur to show the rig is palette-agnostic
    var fig = b.element.querySelector('.pkbulb');
    fig.querySelectorAll('.body,.head,.ears,.legs .leg').forEach(function (el) { el.style.background = '#8bd08b'; });
    fig.querySelector('.bulb').style.background = '#4caf50';
  });

  /* probe: union bbox of the figure's real elements, in NATIVE canvas px.
     Stops the patrol + clears the translate first for a clean static read,
     and reports the figure centre with flip OFF vs ON — if they differ the
     figure isn't centred in the canvas (flip pivots on the canvas centre, so
     it would jump sideways at each turn). */
  function bbox() {
    var fig = b.element.querySelector('.pkbulb');
    var s = b.element.clientHeight / Pokemons.bulbasaur.nativeH;
    var cr = fig.getBoundingClientRect();
    var minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    fig.querySelectorAll('*').forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (!r.width && !r.height) return;
      minX = Math.min(minX, r.left); minY = Math.min(minY, r.top);
      maxX = Math.max(maxX, r.right); maxY = Math.max(maxY, r.bottom);
    });
    return {
      left: +((minX - cr.left) / s).toFixed(1), right: +((maxX - cr.left) / s).toFixed(1),
      top: +((minY - cr.top) / s).toFixed(1), bottom: +((maxY - cr.top) / s).toFixed(1)
    };
  }
  function probe() {
    if (walking) { walking.stop(); walking = null; }
    b.element.style.transform = ''; b.element.style.left = '8%';
    b.setFlip(false); var off = bbox();
    b.setFlip(true);  var on = bbox();
    b.setFlip(false);
    // pause test: a DEEP :nth-child gait selector must freeze under .pk-paused
    var legEl = b.element.querySelector('.legs .leg:nth-child(1)');
    var running = getComputedStyle(legEl).animationPlayState;
    b.setPaused(true);
    var pausedState = getComputedStyle(legEl).animationPlayState;
    b.setPaused(false);
    var NW = Pokemons.bulbasaur.nativeW, NH = Pokemons.bulbasaur.nativeH;
    return {
      nativeW: NW, nativeH: NH, canvasCenter: NW / 2,
      left: off.left, right: off.right, top: off.top, bottom: off.bottom,
      centerOff: +((off.left + off.right) / 2).toFixed(1),
      centerOn: +((on.left + on.right) / 2).toFixed(1),
      footFracMeasured: +(off.bottom / NH).toFixed(3),
      gaitRunning: running, gaitAfterPause: pausedState
    };
  }

  window.__pk = { list: [b], probe: probe, patrol: function () { return walking; } };
})();
</script>
</body>
</html>

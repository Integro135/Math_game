<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savanna Animals — Parade</title>
<!-- ───────────────────────────────────────────────────────────────────────
     ALL the from-scratch savanna animal rigs side by side, drawn at ONE
     shared px-per-unit scale (so their relative sizes are the rigs' own
     HEIGHT/WIDTH), on the same sunset backdrop as animals.html. Use it to
     judge them as a family: same eye/brow language, same softness, same
     palette. Walk marches the whole parade across the screen (each animal
     wraps around when it leaves on the right); Act plays every animal's
     signature action, staggered; BG cycles the backdrop. A missing rig file
     is simply skipped. window._paradeTest exposes hooks for the screenshot
     harness.
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body { background: #2a0f22; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  #ctrl { position: fixed; bottom: 22px; left: 0; right: 0; display: flex; gap: 8px;
          justify-content: center; z-index: 10; }
  .hbtn {
    padding: 8px 18px;
    background: rgba(60, 24, 14, 0.5);
    color: rgba(255, 214, 160, 0.92);
    border: 1px solid rgba(255, 170, 90, 0.4);
    border-radius: 999px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(6px);
    box-shadow: 0 4px 18px rgba(20, 5, 8, 0.45);
    transition: background .25s, transform .15s;
  }
  .hbtn:hover { background: rgba(120, 50, 26, 0.6); transform: translateY(-1px); }
  .hbtn.on { background: rgba(200, 110, 40, 0.65); }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ctrl">
  <button class="hbtn" id="walk">Walk</button>
  <button class="hbtn" id="act">Act</button>
  <button class="hbtn" id="bg">BG</button>
</div>
<script src="rig-common.js"></script>
<script src="lion.js"></script>
<script src="cats.js"></script>
<script src="zebra.js"></script>
<script src="giraffe.js"></script>
<script src="elephant.js"></script>
<script src="ostrich.js"></script>
<script>
(function(){
  // parade order (tall ones first), each with its rig global and tweaks
  const ORDER = [
    { name: 'giraffe',  rig: 'GiraffeRig' },
    { name: 'elephant', rig: 'ElephantRig' },
    { name: 'zebra',    rig: 'ZebraRig' },
    { name: 'lion',     rig: 'LionRig' },
    { name: 'lioness',  rig: 'LionessRig' },
    { name: 'cub',      rig: 'LionessRig', scale: 0.5, extra: { ribbon: true } },
    { name: 'cheetah',  rig: 'CheetahRig' },
    { name: 'ostrich',  rig: 'OstrichRig' },
  ].filter(o => window[o.rig]);
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const DPR = Math.min(devicePixelRatio || 1, 2);
  const BGS = ['sunset', 'plain', 'night'];
  let W, H, bgI = 0, lastT = 0, walking = false, S = 1;
  const GAP = 14;                                  // units between animals
  const cast = ORDER.map((o, i) => ({
    o, R: window[o.rig], sc: o.scale || 1,
    L: Object.assign({ x: 0, y: 0, s: 1, dir: 1, ph: i * 0.9, wt: i * 1.3, moving: false, pose: 0 }, o.extra || {}),
    poseT0: null,
  }));

  function layout(){
    const maxH = Math.max(...cast.map(c => c.R.HEIGHT * c.sc));
    const total = cast.reduce((a, c) => a + c.R.WIDTH * 2 * c.sc + GAP, 0);
    S = Math.min(H * 0.58 / maxH, W * 0.92 / total);
    let x = (W - total * S) / 2;
    for (const c of cast){
      const w = c.R.WIDTH * 2 * c.sc * S;
      c.L.x = x + w / 2; c.L.y = H * 0.80; c.L.s = S * c.sc;
      x += w + GAP * S;
    }
  }
  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }
  addEventListener('resize', resize); resize();

  function backdrop(){
    const bg = BGS[bgI];
    if (bg === 'plain'){ ctx.fillStyle = '#3a3f4b'; ctx.fillRect(0, 0, W, H); return; }
    const sky = ctx.createLinearGradient(0, 0, 0, H * 0.8);
    if (bg === 'sunset'){
      sky.addColorStop(0, '#3a1030'); sky.addColorStop(0.45, '#b53a2a');
      sky.addColorStop(0.78, '#f08a3c'); sky.addColorStop(1, '#f7c25a');
    } else {
      sky.addColorStop(0, '#060b1e'); sky.addColorStop(0.7, '#1a2a52'); sky.addColorStop(1, '#3a4a78');
    }
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    if (bg === 'sunset'){
      const sun = ctx.createRadialGradient(W * 0.72, H * 0.62, 0, W * 0.72, H * 0.62, H * 0.22);
      sun.addColorStop(0, 'rgba(255,245,200,.95)'); sun.addColorStop(0.6, 'rgba(255,210,110,.75)');
      sun.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
    }
    const gr = ctx.createLinearGradient(0, H * 0.8, 0, H);
    gr.addColorStop(0, bg === 'sunset' ? '#8a5230' : '#2a2438'); gr.addColorStop(1, bg === 'sunset' ? '#4e2c18' : '#141224');
    ctx.fillStyle = gr; ctx.fillRect(0, H * 0.8, W, H * 0.2);
  }

  function frame(ts){
    const t = ts / 1000, dt = Math.min(0.05, Math.max(0, t - lastT)); lastT = t;
    backdrop();
    for (const c of cast){
      const L = c.L;
      L.moving = walking && c.poseT0 === null;
      if (L.moving){
        L.wt += dt * 2.2;
        L.x += 30 * L.s * dt;
        const w = c.R.WIDTH * 2 * L.s;
        if (L.x - w > W) L.x = -w;                 // wrap around: a parade
      }
      L.pose = c.poseT0 === null ? 0 : Math.min(1, (t - c.poseT0) / 1.7);
      if (L.pose >= 1){ c.poseT0 = null; L.pose = 0; }
    }
    // back-to-front so a wrapped animal overlaps sensibly
    for (const c of cast){
      ctx.fillStyle = 'rgba(38,14,6,.30)';
      ctx.beginPath(); ctx.ellipse(c.L.x, c.L.y + 1.5 * c.L.s, c.R.WIDTH * 0.95 * c.L.s, 6 * c.L.s, 0, 0, Math.PI * 2); ctx.fill();
      c.R.draw(ctx, c.L, t);
    }
    ctx.fillStyle = 'rgba(255,214,160,.7)'; ctx.font = '13px Georgia, serif';
    for (const c of cast) ctx.fillText(c.o.name, c.L.x - ctx.measureText(c.o.name).width / 2, H * 0.80 + 26);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  const act = () => cast.forEach((c, i) => { if (c.poseT0 === null) c.poseT0 = lastT + i * 0.18; });
  document.getElementById('walk').onclick = e => { walking = !walking; e.target.classList.toggle('on', walking); };
  document.getElementById('act').onclick = act;
  document.getElementById('bg').onclick = () => { bgI = (bgI + 1) % BGS.length; };
  cv.addEventListener('click', e => {
    for (const c of cast){
      const hw = c.R.WIDTH * c.L.s, hh = c.R.HEIGHT * c.L.s;
      if (e.clientX > c.L.x - hw && e.clientX < c.L.x + hw && e.clientY > c.L.y - hh && e.clientY < c.L.y + 8 * c.L.s){
        if (c.poseT0 === null) c.poseT0 = lastT; return;
      }
    }
  });
  window._paradeTest = { act, walk: on => { walking = on; }, setBg: i => { bgI = i; }, names: () => cast.map(c => c.o.name) };
})();
</script>
</body>
</html>

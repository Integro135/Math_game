<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond planet — background dev harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     DEV HARNESS for the Diamond Planet background.
     The actual scene lives in diamonds.bg.js — the SAME file the game
     would load; this page just gives it a stage. Buttons: Restart and
     light-cycle jumps that drive BACKGROUNDS.diamonds._test.seek(0..1).
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #0a0618; }
  #stage { position: fixed; inset: 0; }
  .hbtn {
    position: fixed; bottom: 18px; z-index: 10;
    padding: 8px 18px;
    background: rgba(20, 12, 44, 0.55);
    color: rgba(235, 228, 255, 0.95);
    border: 1px solid rgba(190, 160, 255, 0.35);
    border-radius: 999px;
    font-family: Georgia, serif; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .hbtn:hover { background: rgba(45, 28, 90, 0.7); }
  #restart { right: 18px; }
  #night   { right: 118px; }
  #gemhour { right: 210px; }
  #noon    { right: 330px; }
  #dawn    { right: 424px; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="dawn"    class="hbtn">Dawn</button>
<button id="noon"    class="hbtn">Noon</button>
<button id="gemhour" class="hbtn">Gem hour</button>
<button id="night"   class="hbtn">Night</button>
<button id="restart" class="hbtn">Restart</button>

<script src="diamonds.bg.js"></script>
<script>
let cleanup = null;
function start() {
  if (cleanup) cleanup();
  cleanup = window.BACKGROUNDS.diamonds.init({ stage: document.getElementById('stage') });
}
function seek(f) {
  const t = window.BACKGROUNDS.diamonds._test;
  if (t) t.seek(f);
}
document.getElementById('restart').addEventListener('click', start);
document.getElementById('dawn').addEventListener('click', () => seek(0.06));
document.getElementById('noon').addEventListener('click', () => seek(0.30));
document.getElementById('gemhour').addEventListener('click', () => seek(0.50));
document.getElementById('night').addEventListener('click', () => seek(0.84));
start();
</script>
</body>
</html>

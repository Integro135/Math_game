<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sky whales — background dev harness</title>
<!-- ───────────────────────────────────────────────────────────────────────
     DEV HARNESS for the SKY WHALES (cloud ocean) background.
     The actual scene lives in whales.bg.js — the SAME file the game
     would load; this page just gives it a stage. Buttons: Restart and
     light-cycle jumps that drive BACKGROUNDS.whales._test.seek(0..1).
     ─────────────────────────────────────────────────────────────────────── -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; background: #101430; }
  #stage { position: fixed; inset: 0; }
  .hbtn {
    position: fixed; bottom: 18px; z-index: 10;
    padding: 8px 18px;
    background: rgba(16, 18, 44, 0.55);
    color: rgba(235, 238, 255, 0.95);
    border: 1px solid rgba(170, 190, 255, 0.35);
    border-radius: 999px;
    font-family: Georgia, serif; font-size: 12px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  .hbtn:hover { background: rgba(35, 40, 90, 0.7); }
  #restart { right: 18px; }
  #night   { right: 118px; }
  #sunset  { right: 210px; }
  #noon    { right: 306px; }
  #dawn    { right: 400px; }
</style>
</head>
<body>
<div id="stage"></div>
<button id="dawn"    class="hbtn">Dawn</button>
<button id="noon"    class="hbtn">Day</button>
<button id="sunset"  class="hbtn">Sunset</button>
<button id="night"   class="hbtn">Night</button>
<button id="restart" class="hbtn">Restart</button>

<script src="whales.bg.js"></script>
<script>
let cleanup = null;
function start() {
  if (cleanup) cleanup();
  cleanup = window.BACKGROUNDS.whales.init({ stage: document.getElementById('stage') });
}
function seek(f) {
  const t = window.BACKGROUNDS.whales._test;
  if (t) t.seek(f);
}
document.getElementById('restart').addEventListener('click', start);
document.getElementById('dawn').addEventListener('click', () => seek(0.07));
document.getElementById('noon').addEventListener('click', () => seek(0.32));
document.getElementById('sunset').addEventListener('click', () => seek(0.56));
document.getElementById('night').addEventListener('click', () => seek(0.83));
start();
</script>
</body>
</html>
